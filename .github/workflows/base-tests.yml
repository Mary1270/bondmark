name: Base tests
on:
  push:
  pull_request:
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fetch forge-std
        run: git clone --depth 1 https://github.com/foundry-rs/forge-std base/lib/forge-std
      - name: Build
        working-directory: base
        run: forge build
      - name: Test
        working-directory: base
        run: forge test -vv
