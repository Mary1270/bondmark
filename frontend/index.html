<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BondMark</title>
<meta name="description" content="Seller bonds and on-chain dispute arbitration for social commerce, built on GenLayer.">
<meta name="theme-color" content="#0b0b12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b12'/%3E%3Cpath d='M16 5l9 4v7c0 5-4 9-9 11-5-2-9-6-9-11V9z' fill='none' stroke='%23b78cff' stroke-width='2.4'/%3E%3Cpath d='M12 16l3 3 5-6' fill='none' stroke='%2345e6c8' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b12;--bg2:#12121c;--card:#161624;--line:#26263a;--tx:#ecebf5;--mut:#9a98b3;--pri:#b78cff;--pk:#ff7ab8;--teal:#45e6c8;--ok:#45e6c8;--warn:#ffc65c;--bad:#ff6b81;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:84px;background:radial-gradient(900px 400px at 85% -10%,#2a1b4d55,transparent),radial-gradient(700px 360px at -10% 10%,#0e3b3a44,transparent),var(--bg)}
a{color:var(--pri);text-decoration:none}
.mono{font-family:'JetBrains Mono',monospace;font-size:.86em}
header{position:sticky;top:0;z-index:20;background:#0b0b12e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.15rem;letter-spacing:-.01em;color:var(--tx)}
.logo svg{width:26px;height:26px}
.grow{flex:1}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.65rem;line-height:1.15;margin:.2em 0 .3em;letter-spacing:-.02em}
h2{font-size:1.15rem;margin:1.4em 0 .5em}
.grad{background:linear-gradient(100deg,var(--pri),var(--pk) 55%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
a.card{display:block;color:var(--tx)}
a.card:active{border-color:var(--pri)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#45e6c855}.pill.warn{color:var(--warn);border-color:#ffc65c55}.pill.bad{color:var(--bad);border-color:#ff6b8155}.pill.pri{color:var(--pri);border-color:#b78cff55}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;color:#0b0b12;background:linear-gradient(100deg,var(--pri),var(--pk));cursor:pointer;min-height:46px}
.btn.sec{background:var(--bg2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.5}
.btn.block{width:100%}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,textarea,select{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:2px solid #b78cff66;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:1.15rem}
.stat span{font-size:.78rem;color:var(--mut)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0b0b12f2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{max-width:760px;margin:0 auto;display:flex}
nav.tabs a{flex:1;text-align:center;padding:10px 2px;color:var(--mut);font-size:.72rem}
nav.tabs a svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a.on{color:var(--teal)}
.toast{position:fixed;left:16px;right:16px;bottom:96px;z-index:50;max-width:728px;margin:0 auto;background:#1d1d30;border:1px solid var(--line);border-left:4px solid var(--pri);padding:12px 14px;border-radius:12px;box-shadow:0 8px 30px #0008}
.toast.err{border-left-color:var(--bad)}.toast.good{border-left-color:var(--ok)}
.meter{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--teal))}
.steps{display:flex;gap:4px;margin:10px 0}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.d{background:var(--teal)}.steps i.c{background:var(--pri)}
.ev{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;background:var(--bg2);border-radius:0 10px 10px 0;word-break:break-word}
.ev.buyer{border-color:var(--pk)}.ev.seller{border-color:var(--teal)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.warn-box{border:1px solid #ffc65c55;background:#ffc65c12;border-radius:12px;padding:10px 12px;font-size:.9rem}
.sk{height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),#1d1d30,var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
details{margin:8px 0}summary{cursor:pointer;color:var(--pri)}
code{font-family:'JetBrains Mono',monospace;font-size:.85em;background:var(--bg2);padding:1px 6px;border-radius:6px;word-break:break-all}
.word{word-break:break-word}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#/"><svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b78cff"/><stop offset="1" stop-color="#45e6c8"/></linearGradient></defs><path d="M16 3l11 5v8c0 6-5 10-11 13C10 26 5 22 5 16V8z" fill="none" stroke="url(#g)" stroke-width="2.4"/><path d="M11 16l4 4 6-8" fill="none" stroke="url(#g)" stroke-width="2.6"/></svg>BondMark</a>
<div class="grow"></div>
<button class="btn sm sec" id="wbtn"></button>
</div></header>
<main id="app"></main>
<nav class="tabs"><div id="tabs"></div></nav>
<div id="toast"></div>

<script type="module">
const GEN = 10n ** 18n;
const DEFAULT_ADDRESS = "ADDRESS";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeStore = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

const S = { addr: null, account: null, client: null, readClient: null, sdk: null, busy: false, params: null };
const qs = new URLSearchParams(location.search);
{
  const reqC = qs.get("c");
  if (reqC && /^0x[0-9a-fA-F]{40}$/.test(reqC) && reqC.toLowerCase() !== String(safeStore.get("bm_contract") || "").toLowerCase()) {
    let ok = false;
    try { ok = window.confirm("This link wants BondMark to use a different contract:\n" + reqC + "\n\nOnly continue if you trust whoever sent it. Anything you send goes to that contract."); } catch {}
    if (ok) safeStore.set("bm_contract", reqC);
  }
}
S.contract = safeStore.get("bm_contract") || DEFAULT_ADDRESS;
const validAddr = a => /^0x[0-9a-fA-F]{40}$/.test(a || "");

function toast(msg, kind = "") {
  const t = $("#toast");
  t.innerHTML = `<div class="toast ${kind}">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.innerHTML = "", kind === "err" ? 7000 : 3500);
}
const safeHref = u => /^https:\/\/[^\s"'<>\\]+$/.test(String(u)) ? esc(u) : "#";
const short = a => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
const fmtGen = v => {
  const b = BigInt(v || 0);
  const whole = b / GEN, frac = (b % GEN) * 100n / GEN;
  return frac === 0n ? whole.toString() : `${whole}.${frac.toString().padStart(2, "0")}`.replace(/0$/, "");
};
const fmtTime = t => t ? new Date(t * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "—";
const ago = t => {
  if (!t) return "—";
  const d = Math.floor(Date.now() / 1000) - t, a = Math.abs(d);
  const u = a < 3600 ? [Math.max(1, Math.round(a / 60)), "min"] : a < 86400 ? [Math.round(a / 3600), "h"] : [Math.round(a / 86400), "d"];
  return d >= 0 ? `${u[0]}${u[1]} ago` : `in ${u[0]}${u[1]}`;
};
const now = () => Math.floor(Date.now() / 1000);
const STATUS = {
  OPEN: ["Open", "pri"], PAYMENT_CLAIMED: ["Payment claimed", "warn"], ACTIVE: ["Awaiting delivery", "pri"],
  DELIVERED: ["Delivered", "pri"], COMPLETED: ["Completed", "ok"], DISPUTED: ["In dispute", "bad"],
  REOPENED: ["Dispute reopened", "bad"], PAYOUT_PENDING: ["Payout pending", "warn"], CHALLENGED: ["Payout challenged", "bad"], RESOLVED: ["Resolved", "warn"], CANCELLED: ["Cancelled", ""], EXPIRED: ["Expired", ""]
};
const pill = s => { const [l, k] = STATUS[s] || [s, ""]; return `<span class="pill ${k}">${l}</span>`; };
const levelPill = l => `<span class="pill ${l === "PREMIUM" ? "pri" : l === "VERIFIED" ? "ok" : ""}">${esc(l)}</span>`;

async function loadSdk() {
  if (S.sdk) return S.sdk;
  const [lib, chains] = await Promise.all([
    import("https://esm.sh/genlayer-js@latest"),
    import("https://esm.sh/genlayer-js@latest/chains")
  ]);
  S.sdk = { createClient: lib.createClient, studionet: chains.studionet };
  return S.sdk;
}
async function readClient() {
  if (S.readClient) return S.readClient;
  const sdk = await loadSdk();
  S.readClient = sdk.createClient({ chain: sdk.studionet });
  return S.readClient;
}
async function read(fn, args = []) {
  if (!validAddr(S.contract)) throw new Error("Contract address is not set. Open Settings.");
  const c = await readClient();
  const out = await c.readContract({ address: S.contract, functionName: fn, args });
  return out;
}
async function readJson(fn, args = []) {
  const out = await read(fn, args);
  if (out === "" || out == null) return null;
  return typeof out === "string" ? JSON.parse(out) : out;
}
async function write(fn, args = [], value = 0n, okMsg = "Done") {
  if (!S.account) { toast("Connect a wallet first", "err"); return null; }
  if (S.busy) return null;
  S.busy = true;
  try {
    toast("Confirm in your wallet…");
    const hash = await S.client.writeContract({ address: S.contract, functionName: fn, args, value });
    toast("Waiting for consensus…");
    try { await S.client.waitForTransactionReceipt({ hash, retries: 120, interval: 3000 }); } catch (e) { console.warn(e); }
    toast(okMsg, "good");
    return hash;
  } catch (e) {
    toast(e?.shortMessage || e?.message || "Transaction failed", "err");
    return null;
  } finally { S.busy = false; }
}

async function connect() {
  if (!window.ethereum) { toast("No wallet found. Open this page in a wallet browser.", "err"); return; }
  try {
    const [a] = await window.ethereum.request({ method: "eth_requestAccounts" });
    S.account = a;
    const sdk = await loadSdk();
    S.client = sdk.createClient({ chain: sdk.studionet, account: a });
    safeStore.set("bm_auto", "1");
    paintWallet();
    route();
  } catch (e) { toast(e?.message || "Wallet connection failed", "err"); }
}
function paintWallet() {
  const b = $("#wbtn");
  b.textContent = S.account ? short(S.account) : "Connect";
  b.onclick = S.account ? () => (location.hash = "#/me") : connect;
}

const ICON = {
  home: '<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.500 8-8 9-4.500-1-8-4-8-9V6z"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.500v.5"/></svg>'
};
function paintTabs(h) {
  const items = [["#/", "Deals", ICON.home], ["#/sellers", "Sellers", ICON.shield], ["#/new", "New deal", ICON.plus], ["#/me", "Me", ICON.user], ["#/how", "How", ICON.info]];
  $("#tabs").innerHTML = items.map(([href, l, i]) => `<a href="${href}" class="${h === href || (href !== "#/" && h.startsWith(href)) ? "on" : ""}">${i}${l}</a>`).join("");
}

const view = html => { $("#app").innerHTML = html; window.scrollTo(0, 0); };
const skeleton = () => view('<div class="sk"></div><div class="sk"></div><div class="sk"></div>');
const errBox = e => view(`<div class="card"><b>Could not load</b><p class="mut word">${esc(e?.message || e)}</p><a class="btn sm" href="#/settings">Settings</a></div>`);

function dealCard(d) {
  return `<a class="card" href="#/deal/${esc(d.deal_id)}">
    <div class="row between"><b class="word">${esc(d.item)}</b>${pill(d.status)}</div>
    <div class="row between mut" style="margin-top:6px"><span>${esc(d.price_text)}</span><span>Protected <b style="color:var(--teal)">${fmtGen(d.protect)} GEN</b></span></div>
    <div class="mut" style="font-size:.85rem;margin-top:4px">by <span class="mono">${esc(short(d.seller))}</span> · ${ago(d.created_at)}</div></a>`;
}
function sellerCard(s) {
  return `<a class="card" href="#/seller/${esc(s.handle)}">
    <div class="row between"><b>@${esc(s.handle)}</b>${levelPill(s.level)}</div>
    <div class="row" style="margin-top:8px"><div class="grow"><div class="meter"><i style="width:${s.score / 10}%"></i></div></div><b>${s.score}</b></div>
    <div class="mut" style="font-size:.85rem;margin-top:6px">Can protect up to <b style="color:var(--teal)">${fmtGen(s.available_protection)} GEN</b> now · ${s.completed_verified + s.completed_auto} completed · ${s.disputes_lost} lost</div></a>`;
}

async function pageHome() {
  skeleton();
  const [list, params] = await Promise.all([readJson("list_deals", [0, 30]), getParams()]);
  const open = list.deals.filter(d => d.status === "OPEN");
  view(`<h1>Buy from <span class="grad">bonded</span> sellers.</h1>
  <p class="mut">Pay the seller the way you always do. If they don't deliver, their bond pays you back. Disputes are judged on-chain from the evidence both sides submit.</p>
  <div class="row"><a class="btn sm" href="#/become">Become a seller</a><a class="btn sm sec" href="#/how">How it works</a></div>
  <h2>Open offers <span class="mut">(${open.length})</span></h2>
  ${open.length ? open.map(dealCard).join("") : '<div class="empty">No open offers yet.</div>'}
  <h2>Recent activity</h2>
  ${list.deals.filter(d => d.status !== "OPEN").map(dealCard).join("") || '<div class="empty">Nothing yet.</div>'}`);
}
async function getParams() {
  if (!S.params) S.params = await readJson("get_params");
  return S.params;
}

async function pageSellers() {
  skeleton();
  const list = await readJson("list_sellers");
  list.sort((a, b) => b.score - a.score);
  view(`<h1>Sellers</h1><p class="mut">Ranked by reputation score. A bond is real GEN locked in the contract.</p>
  ${list.length ? list.map(sellerCard).join("") : '<div class="empty">No sellers yet. Be the first.</div>'}`);
}

async function pageSeller(key) {
  skeleton();
  const [s, deals] = await Promise.all([readJson("get_seller", [key]), readJson("deals_of", [key])]);
  if (!s) return view('<div class="empty">Seller not found.</div>');
  const mine = S.account && S.account.toLowerCase() === s.owner;
  view(`<div class="row between"><h1>@${esc(s.handle)}</h1>${levelPill(s.level)}</div>
  <div class="mut" style="font-size:.8rem">Self-declared handle. It is not a verified account — check the wallet address.</div>
  <div class="mut mono word">${esc(s.owner)}</div>
  <div class="card"><div class="row"><div class="grow"><div class="meter"><i style="width:${s.score / 10}%"></i></div></div><b style="font-size:1.4rem">${s.score}</b></div>
  <div class="mut" style="font-size:.8rem">Reputation score (0–1000)${s.trusted ? " · trusted lock ratio" : ""}</div></div>
  <div class="grid">
    <div class="stat"><b>${fmtGen(s.bond)} GEN</b><span>Total bond</span></div>
    <div class="stat"><b>${fmtGen(s.locked)} GEN</b><span>Locked in deals</span></div>
    <div class="stat"><b style="color:var(--teal)">${fmtGen(s.available_protection)} GEN</b><span>Can protect now</span></div>
    <div class="stat"><b>${s.active_deals}</b><span>Active deals</span></div>
    <div class="stat"><b>${s.completed_verified}</b><span>Buyer-confirmed</span></div>
    <div class="stat"><b>${s.completed_auto}</b><span>Auto-completed</span></div>
    <div class="stat"><b>${s.disputes_won} / ${s.disputes_split} / ${s.disputes_lost}</b><span>Disputes won / split / lost</span></div>
    <div class="stat"><b>${s.rejected_claims}</b><span>Payment claims rejected</span></div>
  </div>
  ${mine ? `<h2>Manage bond</h2><div class="card"><label>Add bond (whole GEN)</label><input id="addb" type="number" min="1" step="1" inputmode="numeric"><button class="btn block" style="margin-top:10px" id="addbtn">Add bond</button>
  <label>Withdraw (whole GEN, free bond only)</label><input id="wdb" type="number" min="1" step="1" inputmode="numeric"><button class="btn sec block" style="margin-top:10px" id="wdbtn">Withdraw</button></div>` : ""}
  <h2>Deals</h2>${deals.length ? deals.map(dealCard).join("") : '<div class="empty">No deals yet.</div>'}
  <p class="mut" style="font-size:.8rem">The Instagram handle is a self-declared label. BondMark does not verify account ownership.</p>`);
  if (mine) {
    $("#addbtn").onclick = async () => {
      const n = parseInt($("#addb").value, 10); if (!(n > 0)) return toast("Enter a whole number", "err");
      if (await write("add_bond", [], BigInt(n) * GEN, "Bond added")) route();
    };
    $("#wdbtn").onclick = async () => {
      const n = parseInt($("#wdb").value, 10); if (!(n > 0)) return toast("Enter a whole number", "err");
      if (await write("withdraw_bond", [BigInt(n) * GEN], 0n, "Moved to your claimable balance")) route();
    };
  }
}

function stepper(d) {
  const order = ["OPEN", "PAYMENT_CLAIMED", "ACTIVE", "DELIVERED", "COMPLETED"];
  let idx = order.indexOf(d.status);
  if (["DISPUTED", "REOPENED", "PAYOUT_PENDING", "CHALLENGED", "RESOLVED"].includes(d.status)) idx = 4;
  if (["CANCELLED", "EXPIRED"].includes(d.status)) idx = -1;
  return `<div class="steps">${order.map((_, i) => `<i class="${i < idx ? "d" : i === idx ? "c" : ""}"></i>`).join("")}</div>`;
}

async function pageDeal(id) {
  skeleton();
  const [d, p] = await Promise.all([readJson("get_deal", [id]), getParams()]);
  if (!d) return view('<div class="empty">Deal not found.</div>');
  const ev = ["DISPUTED", "REOPENED", "PAYOUT_PENDING", "CHALLENGED", "RESOLVED"].includes(d.status) ? await readJson("get_evidence", [id]) : [];
  const me = (S.account || "").toLowerCase();
  const isSeller = me && me === d.seller, isBuyer = me && me === d.buyer;
  const t = now();
  let info = "", actions = "";
  if (d.status === "OPEN") {
    info = `Offer open until ${fmtTime(d.offer_expires)}.`;
    if (isSeller) actions = `<button class="btn sec block" id="cancel">Cancel offer</button>`;
    else if (t > d.offer_expires) actions = `<button class="btn sec block" id="expire">Release expired offer</button>`;
    else actions = `<div class="warn-box">Pay the seller off-chain first (bank, card, whatever they use). Then paste your payment reference here.</div>
      <label>Payment reference</label><input id="pref" maxlength="300" placeholder="Transfer ID, receipt number, last digits…">
      <div class="warn-box" style="margin-top:8px">Claiming needs a deposit of exactly ${fmtGen(p.claim_deposit)} GEN. You get it back when the deal completes. If the seller rejects the claim, it is burned (paid to nobody).</div>
      <button class="btn block" style="margin-top:10px" id="claimpay">I paid — claim payment (${fmtGen(p.claim_deposit)} GEN deposit)</button>`;
  } else if (d.status === "PAYMENT_CLAIMED") {
    const dl = d.claimed_at + p.confirm_window;
    info = `Payment reference: <span class="mono word">${esc(d.payment_ref)}</span><br>Seller must answer by ${fmtTime(dl)}. If they stay silent the deal binds automatically.`;
    if (isSeller) actions = `<button class="btn block" id="accept">Payment received — accept</button>
      <label>Or reject (reason)</label><input id="rrs" maxlength="200" placeholder="Why this payment is not valid"><button class="btn sec block" style="margin-top:10px" id="reject">Reject claim</button>`;
    else if (t >= dl) actions = `<button class="btn block" id="timeout">Bind deal (seller silent)</button>`;
  } else if (d.status === "ACTIVE") {
    info = `Bound by ${esc(d.bound_by)}. Delivery deadline ${fmtTime(d.delivery_deadline)} (${ago(d.delivery_deadline)}).${d.bound_by === "timeout" ? '<br><span class="pill warn">Seller never confirmed payment</span> Compensation is capped at 25% of the protected amount and needs reviewed payment proof.' : ""}`;
    if (isSeller) actions = `<label>Delivery proof (tracking number, details)</label><textarea id="dtx" maxlength="1500"></textarea>
      <label>Proof link (https, optional)</label><input id="dur" maxlength="300" placeholder="https://…">
      <button class="btn block" style="margin-top:10px" id="deliver">Submit delivery</button>`;
    if (isBuyer && t > d.delivery_deadline && t <= d.delivery_deadline + p.review_window)
      actions += disputeForm(p);
    if (t > d.delivery_deadline + p.review_window) actions += `<button class="btn sec block" style="margin-top:10px" id="finalize">Close lapsed deal</button>`;
  } else if (d.status === "DELIVERED") {
    const rv = d.delivered_at + p.review_window;
    info = `Seller says delivered ${ago(d.delivered_at)}.<br><span class="word">${esc(d.delivery_text)}</span>${d.delivery_url ? `<br><a href="${safeHref(d.delivery_url)}" target="_blank" rel="noopener noreferrer">Proof link</a>` : ""}<br>Buyer can confirm or dispute until ${fmtTime(rv)}.`;
    if (isBuyer && t <= rv) actions = `<button class="btn block" id="confirm">I received it — confirm</button>` + disputeForm(p);
    else if (t > rv) actions = `<button class="btn sec block" id="finalize">Complete deal (review window ended)</button>`;
  } else if (d.status === "PAYOUT_PENDING") {
    info = `<b>Ruling: ${esc(d.verdict.replace("_", " "))}</b> (payment was never confirmed by the seller)<br><span class="word">${esc(d.reason)}</span><br>Pending payout ${fmtGen(d.pending_comp)} GEN. It unlocks ${fmtTime(d.unlock_at)} (${ago(d.unlock_at)}). The seller can challenge until then.`;
    if (isSeller && t < d.unlock_at) actions = `<label>Challenge: why was payment never received?</label><textarea id="ctx" maxlength="1500"></textarea>
      <label>Proof link (https, optional)</label><input id="cur" maxlength="300"><button class="btn block" style="margin-top:10px" id="challenge">Challenge payout</button>`;
    else if (t >= d.unlock_at) actions = `<button class="btn block" id="finpay">Release payout</button>`;
  } else if (d.status === "DISPUTED" || d.status === "REOPENED" || d.status === "CHALLENGED") {
    info = `Evidence closes ${fmtTime(d.evidence_deadline)} (${ago(d.evidence_deadline)}).${d.status === "REOPENED" ? "<br>The first review found too little evidence. Both sides get one more chance." : d.status === "CHALLENGED" ? "<br>The seller challenged the pending payout. The ruling will be re-reviewed and, if it still favors the buyer, paid out immediately (still capped)." : ""}`;
    if (t <= d.evidence_deadline && (isBuyer || isSeller)) actions = `<label>Add evidence</label><textarea id="etx" maxlength="1500"></textarea>
      <label>Evidence link (https, optional)</label><input id="eur" maxlength="300"><button class="btn block" style="margin-top:10px" id="addev">Submit evidence</button>`;
    if (t > d.evidence_deadline) actions = `<button class="btn block" id="resolve">Run arbitration</button><p class="mut" style="font-size:.85rem">Anyone can trigger this. Validators will read the frozen evidence and reach consensus.</p>`;
    if (t > d.evidence_deadline + p.stall_window) actions += `<button class="btn sec block" style="margin-top:10px" id="stalled">Arbitration stalled — close with no payout</button>`;
  } else if (d.status === "RESOLVED") {
    info = `<b>${esc(d.outcome.replace("_", " "))}</b>${d.reason ? `<br><span class="word">${esc(d.reason)}</span>` : ""}<br>Reason code: <span class="mono">${esc(d.reason_code)}</span><br>Compensation ${fmtGen(d.compensation)} GEN · fee ${fmtGen(d.fee)} GEN${d.bound_by === "timeout" ? `<br>Payment unconfirmed by seller · cap ${d.comp_cap_bps / 100}% · payment evidence reviewed: ${d.payment_reviewed ? "yes" : "no"}` : ""}`;
  } else if (d.status === "COMPLETED") info = d.outcome === "CONFIRMED" ? "Buyer confirmed delivery." : "Completed automatically after the review window.";
  else info = esc(d.outcome);

  view(`<div class="row between"><a href="#/" class="mut">← Deals</a>${pill(d.status)}</div>
  <h1 class="word">${esc(d.item)}</h1>
  ${stepper(d)}
  <div class="grid">
    <div class="stat"><b>${esc(d.price_text)}</b><span>Price (display only)</span></div>
    <div class="stat"><b style="color:var(--teal)">${fmtGen(d.protect)} GEN</b><span>Protected amount</span></div>
  </div>
  <div class="warn-box" style="font-size:.85rem">Only the protected amount is covered, not the price. The price text is not enforced by the contract.</div>
  <div class="card word">${info || ""}</div>
  <div class="card"><div class="row between"><span class="mut">Seller</span><a class="mono" href="#/seller/${esc(d.seller)}">${esc(short(d.seller))}</a></div>
  ${d.buyer ? `<div class="row between"><span class="mut">Buyer</span><span class="mono">${esc(short(d.buyer))}</span></div>` : ""}
  <div class="row between"><span class="mut">Bond locked</span><span>${fmtGen(d.lock)} GEN</span></div>
  <div class="row between"><span class="mut">Delivery window</span><span>${Math.round(d.delivery_secs / p.unit)} h</span></div>
  ${d.listing_url ? `<div class="row between"><span class="mut">Listing</span><a href="${safeHref(d.listing_url)}" target="_blank" rel="noopener noreferrer">open</a></div>` : ""}
  ${d.rejections ? `<div class="row between"><span class="mut">Earlier claims rejected</span><span>${d.rejections}</span></div>` : ""}</div>
  ${actions ? `<div class="card">${actions}</div>` : ""}
  ${ev.length ? `<h2>Evidence on record</h2>${ev.map(e => `<div class="ev ${esc(e.side)}"><b>${esc(e.side)}</b> <span class="mut">${ago(e.at)}</span><div>${esc(e.text)}</div>${e.url ? `<a href="${safeHref(e.url)}" target="_blank" rel="noopener noreferrer" class="word">${esc(e.url)}</a>` : ""}<div class="mono mut" style="font-size:.7rem">sha256 ${esc(e.digest.slice(0, 16))}…</div></div>`).join("")}` : ""}`);

  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  const go = async (fn, args, val, msg) => { if (await write(fn, args, val, msg)) route(); };
  on("#cancel", () => go("cancel_deal", [id], 0n, "Offer cancelled"));
  on("#expire", () => go("expire_offer", [id], 0n, "Offer released"));
  on("#claimpay", () => { const v = $("#pref").value.trim(); if (v.length < 5) return toast("Add a payment reference (5+ characters)", "err"); go("claim_payment", [id, v], BigInt(p.claim_deposit), "Payment claimed"); });
  on("#accept", () => go("respond_payment", [id, true, ""], 0n, "Deal is now binding"));
  on("#reject", () => { const v = $("#rrs").value.trim(); if (v.length < 5) return toast("Give a short reason", "err"); go("respond_payment", [id, false, v], 0n, "Claim rejected"); });
  on("#timeout", () => go("bind_by_timeout", [id], 0n, "Deal is now binding"));
  on("#deliver", () => { const v = $("#dtx").value.trim(); if (v.length < 3) return toast("Describe the delivery", "err"); go("submit_delivery", [id, v, $("#dur").value.trim()], 0n, "Delivery submitted"); });
  on("#confirm", () => go("confirm_delivery", [id], 0n, "Thanks — deal completed"));
  on("#finalize", () => go("finalize_deal", [id], 0n, "Deal closed"));
  on("#dispute", () => {
    const v = $("#dcl").value.trim(); if (v.length < 10) return toast("Describe the problem (10+ characters)", "err");
    go("open_dispute", [id, v, $("#dur2").value.trim()], BigInt(p.dispute_deposit), "Dispute opened");
  });
  on("#addev", () => { const v = $("#etx").value.trim(); if (v.length < 5) return toast("Write the evidence (5+ characters)", "err"); go("submit_evidence", [id, v, $("#eur").value.trim()], 0n, "Evidence recorded"); });
  on("#resolve", () => go("resolve_dispute", [id], 0n, "Arbitration finished"));
  on("#challenge", () => { const v = $("#ctx").value.trim(); if (v.length < 5) return toast("Explain the challenge (5+ characters)", "err"); go("challenge_payout", [id, v, $("#cur").value.trim()], 0n, "Payout challenged"); });
  on("#finpay", () => go("finalize_payout", [id], 0n, "Payout released"));
  on("#stalled", () => go("close_stalled_dispute", [id], 0n, "Dispute closed, deposit returned"));
}
function disputeForm(p) {
  return `<details style="margin-top:12px"><summary>Something is wrong — open a dispute</summary>
  <div class="warn-box" style="margin-top:8px">Needs a deposit of exactly ${fmtGen(p.dispute_deposit)} GEN. You get it back unless the verdict is SELLER_WINS. If the seller never confirmed your payment, include proof of payment in your claim; compensation is then capped at 25%.</div>
  <label>What happened?</label><textarea id="dcl" maxlength="1500"></textarea>
  <label>Evidence link (https, optional)</label><input id="dur2" maxlength="300">
  <button class="btn block" style="margin-top:10px" id="dispute">Open dispute</button></details>`;
}

async function pageNew() {
  const p = await getParams();
  let seller = null;
  if (S.account) seller = await readJson("get_seller", [S.account.toLowerCase()]).catch(() => null);
  if (!S.account) return view(`<h1>New deal</h1><div class="card"><p>Connect a wallet to create an offer.</p><button class="btn" id="c2">Connect</button></div>`), $("#c2").onclick = connect;
  if (!seller) return view(`<h1>New deal</h1><div class="card"><p>You need to be a registered seller first.</p><a class="btn" href="#/become">Become a seller</a></div>`);
  view(`<h1>New deal</h1>
  <div class="card"><div class="row between"><span class="mut">You can protect up to</span><b style="color:var(--teal)">${fmtGen(seller.available_protection)} GEN</b></div>
  <div class="mut" style="font-size:.85rem">Bond locked per deal: ${seller.lock_bps / 100}% of the protected amount.</div></div>
  <label>Item</label><input id="item" maxlength="200" placeholder="Red leather handbag, size M">
  <label>Price (shown to the buyer, e.g. “40 USD”)</label><input id="price" maxlength="80">
  <label>Listing link (https, optional)</label><input id="lurl" maxlength="300" placeholder="https://instagram.com/p/…">
  <label>Protected amount (whole GEN)</label><input id="prot" type="number" min="1" step="1" inputmode="numeric">
  <label>Delivery time (hours)</label><input id="hrs" type="number" min="1" max="720" step="1" value="72" inputmode="numeric">
  <button class="btn block" style="margin-top:16px" id="create">Create offer</button>`);
  $("#create").onclick = async () => {
    const item = $("#item").value.trim(), price = $("#price").value.trim();
    const prot = parseInt($("#prot").value, 10), hrs = parseInt($("#hrs").value, 10);
    if (item.length < 3 || !price || !(prot >= 1) || !(hrs >= 1)) return toast("Fill every required field", "err");
    if (await write("create_deal", [item, price, $("#lurl").value.trim(), BigInt(prot) * GEN, BigInt(hrs)], 0n, "Offer created")) location.hash = "#/seller/" + seller.handle;
  };
}

async function pageBecome() {
  const p = await getParams();
  view(`<h1>Become a <span class="grad">bonded</span> seller</h1>
  <p class="mut">Lock GEN as a bond. If you fail to deliver and lose a dispute, buyers are paid from it.</p>
  <div class="card">
  <div class="row between"><span>STARTER</span><span class="mut">${fmtGen(p.min_bond)}+ GEN · up to ${fmtGen(p.max_protect[0])} GEN per deal</span></div>
  <div class="row between"><span>VERIFIED</span><span class="mut">${fmtGen(p.verified_bond)}+ GEN · up to ${fmtGen(p.max_protect[1])} GEN</span></div>
  <div class="row between"><span>PREMIUM</span><span class="mut">${fmtGen(p.premium_bond)}+ GEN · up to ${fmtGen(p.max_protect[2])} GEN</span></div></div>
  <label>Handle (letters, numbers, _ and .; 3–30)</label><input id="handle" maxlength="30" autocapitalize="none" placeholder="my_shop">
  <label>Bond (whole GEN)</label><input id="bond" type="number" min="${fmtGen(p.min_bond)}" step="1" inputmode="numeric" value="${fmtGen(p.min_bond)}">
  <div class="warn-box" style="margin-top:12px">Your handle is a label you choose. BondMark does not prove you own the Instagram account with that name.</div>
  <button class="btn block" style="margin-top:14px" id="reg">Register and lock bond</button>`);
  $("#reg").onclick = async () => {
    const h = $("#handle").value.trim().toLowerCase();
    const n = parseInt($("#bond").value, 10);
    if (!/^[a-z0-9_.]{3,30}$/.test(h)) return toast("Invalid handle", "err");
    if (!(n >= Number(BigInt(p.min_bond) / GEN))) return toast("Bond is below the minimum", "err");
    if (await write("register_seller", [h], BigInt(n) * GEN, "Registered")) location.hash = "#/seller/" + h;
  };
}

async function pageMe() {
  if (!S.account) { view(`<h1>Me</h1><div class="card"><p>Connect a wallet to see your deals and balance.</p><button class="btn" id="c3">Connect</button></div>`); $("#c3").onclick = connect; return; }
  skeleton();
  const a = S.account.toLowerCase();
  const [cl, seller, deals] = await Promise.all([read("get_claimable", [a]), readJson("get_seller", [a]).catch(() => null), readJson("deals_of", [a])]);
  const amt = BigInt(cl || 0);
  view(`<h1>Me</h1><div class="mono mut word">${esc(S.account)}</div>
  <div class="card"><div class="row between"><div><div class="mut">Claimable balance</div><b style="font-size:1.5rem">${fmtGen(amt)} GEN</b></div>
  <button class="btn" id="claim" ${amt === 0n ? "disabled" : ""}>Claim</button></div></div>
  ${seller ? sellerCard(seller) : `<a class="btn sec block" href="#/become">Become a seller</a>`}
  <h2>My deals</h2>${deals.length ? deals.map(dealCard).join("") : '<div class="empty">No deals yet.</div>'}
  <p><a href="#/settings">Settings</a></p>`);
  $("#claim").onclick = async () => { if (await write("claim", [], 0n, "Sent to your wallet")) route(); };
}

async function pageHow() {
  const p = await getParams().catch(() => null);
  const h = t => Math.round(t / (p?.unit || 3600));
  view(`<h1>How BondMark works</h1>
  <div class="card"><b>1. Seller posts a bond</b><p class="mut">GEN is locked in the contract. The bond sets how much value one seller can protect.</p></div>
  <div class="card"><b>2. Seller lists a protected deal</b><p class="mut">A part of the bond (${p ? p.lock_bps_new / 100 : 150}% of the protected amount, less for proven sellers) stays locked until the deal ends.</p></div>
  <div class="card"><b>3. Buyer pays off-chain, then claims</b><p class="mut">Pay by bank transfer, cash app or anything the seller accepts. Paste the payment reference. The seller can accept or reject. If they stay silent for ${p ? h(p.confirm_window) : 24} h, the deal binds anyway.</p></div>
  <div class="card"><b>4. Delivery</b><p class="mut">The seller submits delivery proof. The buyer confirms, or after ${p ? h(p.review_window) : 72} h it completes on its own.</p></div>
  <div class="card"><b>5. Dispute</b><p class="mut">The buyer puts down a ${p ? fmtGen(p.dispute_deposit) : 1} GEN deposit. Both sides add up to 3 pieces of evidence. Validators read the frozen evidence and reach consensus: buyer wins (full protected amount), split (half), seller wins, or not enough evidence (one more round, then no payout).</p></div>
  <h2>What it cannot do</h2>
  <div class="warn-box"><ul style="margin:0;padding-left:18px">
  <li>It cannot see your bank. Payments and parcels are judged only from evidence people submit.</li>
  <li>Handles are not verified accounts.</li>
  <li>When the seller stays silent about a payment, any compensation is capped at 25%, needs reviewed payment proof, and is paid only after a 7-day window in which the seller can challenge.</li>
  <li>Claiming a payment needs a refundable deposit; it is burned (paid to nobody) if the seller rejects the claim.</li>
  <li>Compensation is paid in GEN to the buyer's wallet and covers the protected amount, not necessarily the full price.</li>
  <li>Validators are language models. They can be wrong. There is no appeal in this version.</li>
  <li>This is a testnet prototype. Do not use real money.</li></ul></div>`);
}

async function pageSettings() {
  view(`<h1>Settings</h1>
  <div class="card"><label>Contract address</label><input id="caddr" class="mono" value="${esc(S.contract)}" placeholder="0x…">
  <button class="btn block" style="margin-top:10px" id="save">Save</button>
  <p class="mut" style="font-size:.85rem">Network: GenLayer Studio. You can also open this page with <code>?c=0x…</code>.</p></div>`);
  $("#save").onclick = () => {
    const v = $("#caddr").value.trim();
    if (!validAddr(v)) return toast("Not a valid address", "err");
    safeStore.set("bm_contract", v); S.contract = v; S.params = null; toast("Saved", "good"); location.hash = "#/";
  };
}

async function route() {
  const h = location.hash || "#/";
  paintTabs(h);
  const parts = h.slice(2).split("/");
  try {
    if (parts[0] !== "settings" && parts[0] !== "how" && !validAddr(S.contract)) return pageSettings();
    switch (parts[0]) {
      case "": return await pageHome();
      case "sellers": return await pageSellers();
      case "seller": return await pageSeller(decodeURIComponent(parts[1] || ""));
      case "deal": return await pageDeal(decodeURIComponent(parts[1] || ""));
      case "new": return await pageNew();
      case "become": return await pageBecome();
      case "me": return await pageMe();
      case "how": return await pageHow();
      case "settings": return await pageSettings();
      default: return await pageHome();
    }
  } catch (e) { console.error(e); errBox(e); }
}
window.addEventListener("hashchange", route);
paintWallet();
route();
if (safeStore.get("bm_auto") && window.ethereum) {
  window.ethereum.request({ method: "eth_accounts" }).then(async acc => {
    if (acc && acc[0]) { S.account = acc[0]; const sdk = await loadSdk(); S.client = sdk.createClient({ chain: sdk.studionet, account: acc[0] }); paintWallet(); route(); }
  }).catch(() => {});
}
</script>
</body>
</html>
