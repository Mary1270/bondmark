<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BondMark</title>
<meta name="description" content="Seller bonds and on-chain dispute arbitration for social commerce, built on GenLayer.">
<meta name="theme-color" content="#0052FF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230052FF'/%3E%3Cpath d='M16 5l9 4v7c0 5-4 9-9 11-5-2-9-6-9-11V9z' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M12 16l3 3 5-6' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7F8;--surface:#FFFFFF;--surface2:#EEF2F3;--line:#DDE3E6;--tx:#12181C;--mut:#56626B;--sig:#0052FF;--sig-ink:#FFFFFF;--sig-soft:#E5EDFF;--acc:#D62976;--acc-soft:#FCE6EF;--org:#C2570A;--org-soft:#FFEBD9;--ok:#16794F;--warn:#9A6200;--bad:#B3261E;--shadow:0 1px 2px rgba(16,24,28,.06),0 4px 14px rgba(16,24,28,.06);--r:12px;--pri:var(--sig);--teal:var(--sig);--bg2:var(--surface2);--card:var(--surface)}
:root[data-theme=dark]{--bg:#0E1417;--surface:#151D21;--surface2:#1B262B;--line:#26343A;--tx:#E8EEF0;--mut:#9AA9B0;--sig:#6E96FF;--sig-ink:#06143D;--sig-soft:#16224D;--acc:#FF5C9A;--acc-soft:#3B1627;--org:#FFA94D;--org-soft:#3A2410;--ok:#4FD39A;--warn:#F0B54A;--bad:#FF8A80;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;padding-bottom:76px}
a{color:var(--sig);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;color:var(--tx)}
.logo:hover{text-decoration:none}
.logo svg{width:26px;height:26px}
.grow{flex:1;min-width:0}
.shell{max-width:1120px;margin:0 auto;display:block}
aside.side{display:none}
main{padding:16px;min-width:0}
h1{font-size:1.7rem;line-height:1.2;margin:.2em 0 .3em;letter-spacing:-.015em;font-weight:700}
h2{font-size:1.1rem;margin:1.6em 0 .5em;font-weight:700}
h3{font-size:1rem;margin:0 0 4px}
.mut{color:var(--mut)}
.sig{color:var(--sig)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
a.card{display:block;color:var(--tx);border-top:3px solid var(--line)}
a.card:hover{text-decoration:none;border-color:var(--sig)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);color:var(--mut);white-space:nowrap;background:var(--surface)}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.pill.ok{color:var(--ok);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}.pill.bad{color:var(--bad);border-color:currentColor}.pill.pri{color:var(--sig);border-color:currentColor}
.btn{appearance:none;border:1px solid var(--sig);border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;color:var(--sig-ink);background:var(--sig);cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{text-decoration:none;filter:brightness(1.05)}
.btn.sec{background:var(--surface);color:var(--tx);border-color:var(--line)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:.92rem}
.btn:disabled,body.busy .btn{opacity:.55;pointer-events:none}
.btn.block{width:100%}
.iconbtn{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,textarea,select{width:100%;background:var(--surface);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus,.btn:focus-visible,.iconbtn:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-size:1.2rem}
.stat span{font-size:.8rem;color:var(--mut)}
.stat small{display:block;font-size:.75rem;margin-top:2px;color:var(--sig)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{max-width:760px;margin:0 auto;display:flex}
nav.tabs a{flex:1;text-align:center;padding:8px 2px;color:var(--mut);font-size:.72rem;min-height:48px}
nav.tabs a:hover{text-decoration:none}
nav.tabs a svg,aside.side a svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a.on{color:var(--sig);font-weight:600}
aside.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--tx);border:1px solid transparent;margin-bottom:4px}
aside.side a svg{margin:0;width:20px;height:20px}
aside.side a:hover{text-decoration:none;background:var(--surface2)}
aside.side a.on{border-color:var(--sig);color:var(--sig);font-weight:600}
.toast{position:fixed;left:16px;right:16px;bottom:92px;z-index:60;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sig);padding:12px 14px;border-radius:10px;box-shadow:var(--shadow)}
.toast.err{border-left-color:var(--bad)}.toast.good{border-left-color:var(--ok)}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--sig)}
.steps{display:flex;gap:4px;margin:10px 0}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.d{background:var(--sig)}.steps i.c{background:var(--sig);opacity:.55}
.ev{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;background:var(--surface2);border-radius:0 10px 10px 0;word-break:break-word}
.ev.buyer{border-color:var(--warn)}.ev.seller{border-color:var(--sig)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.warn-box{border:1px solid var(--warn);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.9rem}
.sk{height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
details{margin:8px 0}summary{cursor:pointer;color:var(--sig);min-height:36px;display:flex;align-items:center}
code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:var(--surface2);padding:1px 6px;border-radius:6px;word-break:break-all}
.word{word-break:break-word}
.hero{display:grid;gap:16px;align-items:center;padding:8px 0}
.hero p.lede{color:var(--mut);margin:.3em 0 1em;max-width:52ch}
.hero svg.art{width:100%;max-width:320px;height:auto;justify-self:center;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero svg.art,.sk{animation:none}}
.live{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:.8rem;color:var(--mut)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.live.on i{background:var(--ok)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.roles{display:grid;gap:10px}
.role{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;color:var(--tx);box-shadow:var(--shadow)}
.role:hover{border-color:var(--sig);text-decoration:none}
.tile{width:48px;height:48px;border-radius:12px;background:var(--sig-soft);display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{width:26px;height:26px;stroke:var(--sig);fill:none;stroke-width:1.8}
.tile.a{background:var(--acc-soft)}.tile.a svg{stroke:var(--acc)}.tile.o{background:var(--org-soft)}.tile.o svg{stroke:var(--org)}
.feed .dot.a{background:var(--acc)}.how4 .card:nth-child(2) .n{background:var(--acc-soft);color:var(--acc)}.how4 .card:nth-child(4) .n{background:var(--org-soft);color:var(--org)}
.role .arrow{margin-left:auto;color:var(--sig);font-size:1.3rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:.95rem;min-height:38px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--sig);color:var(--sig);text-decoration:none}
.feed .item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed .item:last-child{border-bottom:0}
.feed .dot{width:9px;height:9px;border-radius:50%;background:var(--sig);margin-top:7px;flex:none}
.how4{display:grid;gap:10px}
.how4 .card{margin:0}
.how4 .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--sig-soft);color:var(--sig);font-weight:700;align-items:center;justify-content:center;margin-bottom:6px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--tx);padding:18px;max-width:min(92vw,440px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.track div{font-size:.72rem;text-align:center;color:var(--mut);border-top:4px solid var(--line);padding-top:6px}
.track div.d{border-color:var(--sig);color:var(--tx)}
.track div.c{border-color:var(--sig);opacity:.6}
.track div.x{border-color:var(--bad);color:var(--bad)}
.txbox{position:fixed;left:16px;right:16px;bottom:92px;z-index:55;max-width:560px;margin:0 auto}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}.roles{grid-template-columns:repeat(3,1fr)}.how4{grid-template-columns:repeat(4,1fr)}.hero{grid-template-columns:1.2fr .8fr}}
@media (min-width:1024px){body{padding-bottom:0}nav.tabs{display:none}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:8px}aside.side{display:block;padding:16px 8px 16px 16px;position:sticky;top:60px;align-self:start}main{padding:20px 16px 40px}.toast,.txbox{bottom:24px}}
@media (max-width:480px){#net{display:none}}
</style>
<script>try{var m=localStorage.getItem("bm_theme");if(m)document.documentElement.setAttribute("data-theme",m);else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>

<body>
<header class="top"><div class="bar">
<a class="logo" href="#/"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0052FF"/><stop offset=".55" stop-color="#D62976"/><stop offset="1" stop-color="#FA7E1E"/></linearGradient></defs><path d="M16 3l11 5v8c0 6-5 10-11 13C10 26 5 22 5 16V8z" fill="none" stroke="url(#lg)" stroke-width="2.6"/><path d="M11 16l4 4 6-8" fill="none" stroke="url(#lg)" stroke-width="2.8"/></svg>BondMark</a>
<div class="grow"></div>
<button class="iconbtn" id="themebtn" aria-label="Toggle light and dark theme"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg></button>
<button class="btn sm sec" id="wbtn">Connect</button>
</div></header>
<div class="shell"><aside class="side" id="side"></aside><main id="app"></main></div>
<nav class="tabs"><div id="tabs"></div></nav>
<div id="toast"></div><div id="tx"></div>
<dialog id="dlg"></dialog>

<script type="module">
const GEN = 10n ** 18n;
const DEFAULT_ADDRESS = "0x63cd0550A3e4d0a2cf38A51aA611cCBaD6aF5182";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeStore = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

const S = { addr: null, account: null, client: null, readClient: null, sdk: null, busy: false, params: null };
const qs = new URLSearchParams(location.search);
{
  const reqC = qs.get("contract") || qs.get("c");
  if (reqC && /^0x[0-9a-fA-F]{40}$/.test(reqC) && reqC.toLowerCase() !== String(safeStore.get("bm_contract") || "").toLowerCase()) {
    let ok = false;
    try { ok = window.confirm("This link wants BondMark to use a different contract:\n" + reqC + "\n\nOnly continue if you trust whoever sent it. Anything you send goes to that contract."); } catch {}
    if (ok) safeStore.set("bm_contract", reqC);
  }
}
S.contract = safeStore.get("bm_contract") || DEFAULT_ADDRESS;
const validAddr = a => /^0x[0-9a-fA-F]{40}$/.test(a || "");

function toast(msg, kind = "") {
  const t = $("#toast");
  t.innerHTML = `<div class="toast ${kind}">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.innerHTML = "", kind === "err" ? 7000 : 3500);
}
const safeHref = u => /^https:\/\/[^\s"'<>\\]+$/.test(String(u)) ? esc(u) : "#";
const short = a => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
const fmtGen = v => {
  const b = BigInt(v || 0);
  const whole = b / GEN, frac = (b % GEN) * 100n / GEN;
  return frac === 0n ? whole.toString() : `${whole}.${frac.toString().padStart(2, "0")}`.replace(/0$/, "");
};
const fmtTime = t => t ? new Date(t * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "—";
const ago = t => {
  if (!t) return "—";
  const d = Math.floor(Date.now() / 1000) - t, a = Math.abs(d);
  const u = a < 3600 ? [Math.max(1, Math.round(a / 60)), "min"] : a < 86400 ? [Math.round(a / 3600), "h"] : [Math.round(a / 86400), "d"];
  return d >= 0 ? `${u[0]}${u[1]} ago` : `in ${u[0]}${u[1]}`;
};
const now = () => Math.floor(Date.now() / 1000);
const STATUS = {
  OPEN: ["Open", "pri"], PAYMENT_CLAIMED: ["Payment claimed", "warn"], ACTIVE: ["Awaiting delivery", "pri"],
  DELIVERED: ["Delivered", "pri"], COMPLETED: ["Completed", "ok"], DISPUTED: ["In dispute", "bad"],
  REOPENED: ["Dispute reopened", "bad"], PAYOUT_PENDING: ["Payout pending", "warn"], CHALLENGED: ["Payout challenged", "bad"], RESOLVED: ["Resolved", "warn"], CANCELLED: ["Cancelled", ""], EXPIRED: ["Expired", ""]
};
const pill = s => { const [l, k] = STATUS[s] || [s, ""]; return `<span class="pill ${k}">${l}</span>`; };
const levelPill = l => `<span class="pill ${l === "PREMIUM" ? "pri" : l === "VERIFIED" ? "ok" : ""}">${esc(l)}</span>`;

async function loadSdk() {
  if (S.sdk) return S.sdk;
  const [lib, chains] = await Promise.all([
    import("https://esm.sh/genlayer-js@latest"),
    import("https://esm.sh/genlayer-js@latest/chains")
  ]);
  S.sdk = { createClient: lib.createClient, createAccount: lib.createAccount, generatePrivateKey: lib.generatePrivateKey, studionet: chains.studionet };
  return S.sdk;
}
async function readClient() {
  if (S.readClient) return S.readClient;
  const sdk = await loadSdk();
  S.readClient = sdk.createClient({ chain: sdk.studionet });
  return S.readClient;
}
async function read(fn, args = []) {
  if (!validAddr(S.contract)) throw new Error("Contract address is not set. Open Settings.");
  const c = await readClient();
  const out = await c.readContract({ address: S.contract, functionName: fn, args });
  return out;
}
async function readJson(fn, args = []) {
  const out = await read(fn, args);
  if (out === "" || out == null) return null;
  return typeof out === "string" ? JSON.parse(out) : out;
}
const CONFIRM_FNS = {
  withdraw_bond: "Move this part of your bond to your claimable balance?",
  claim: "Send your claimable balance to your wallet?",
  respond_payment: "Answer this payment claim? Rejecting burns the buyer's claim deposit.",
  challenge_payout: "Challenge the pending payout? The ruling is re-reviewed once.",
  finalize_payout: "Release the pending payout to the buyer?",
  close_stalled_dispute: "Close this dispute with no payout and return deposits?",
  confirm_delivery: "Confirm you received the item? This completes the deal and cannot be undone.",
  register_seller: "Register and lock this bond in the contract?",
  add_bond: "Lock this extra bond in the contract?",
  claim_payment: "Claim the payment and put down the claim deposit?",
  open_dispute: "Open a dispute and put down the dispute deposit?"
};
function confirmBox(title, body) {
  const d = $("#dlg");
  d.innerHTML = `<h3>${esc(title)}</h3><p class="mut">${esc(body)}</p><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec sm" value="no">Cancel</button><button class="btn sm" value="yes">Confirm</button></div>`;
  return new Promise(res => {
    d.onclose = () => res(d.returnValue === "yes");
    d.onclick = e => { if (e.target === d) d.close("no"); };
    for (const b of d.querySelectorAll("button")) b.onclick = () => d.close(b.value);
    try { d.returnValue = ""; d.showModal(); } catch { res(window.confirm(title + "\n\n" + body)); }
  });
}
function paintTrack(stage, fail) {
  const names = ["Signature", "Submitted", "Accepted", "Finalized"];
  $("#tx").innerHTML = stage < 0 ? "" : `<div class="card txbox"><div class="track">${names.map((n, i) => `<div class="${fail === i ? "x" : i < stage ? "d" : i === stage ? "c" : ""}">${n}</div>`).join("")}</div></div>`;
}
function explain(e) {
  const m = String(e?.shortMessage || e?.message || e || "");
  if (e?.code === 4001 || /user (rejected|denied)|rejected the request/i.test(m)) return "You declined the request in your wallet. Nothing was sent.";
  if (/insufficient (funds|balance)/i.test(m)) return "Not enough GEN in this wallet for the amount plus fees.";
  if (/chain|network/i.test(m) && /mismatch|switch|wrong|unrecognized/i.test(m)) return "Your wallet is on the wrong network. Switch to GenLayer Studio and try again.";
  const r = m.match(/(?:Exception|Error|reverted)[^:]*:\s*(.+)$/is);
  if (r) return "The contract refused this action: " + r[1].trim().slice(0, 200);
  return m || "Transaction failed";
}
async function ensureNetwork() {
  if (S.account && S.localKey) return true;
  if (!window.ethereum) return true;
  const sdk = await loadSdk();
  const want = sdk.studionet?.id;
  if (!want) return true;
  const have = parseInt(await window.ethereum.request({ method: "eth_chainId" }), 16);
  if (have === want) return true;
  const ok = await confirmBox("Wrong network", "Your wallet is on another network. Switch to GenLayer Studio?");
  if (!ok) return false;
  const hex = "0x" + want.toString(16);
  try { await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] }); return true; }
  catch (e) {
    try {
      const c = sdk.studionet;
      await window.ethereum.request({ method: "wallet_addEthereumChain", params: [{ chainId: hex, chainName: c.name || "GenLayer Studio", nativeCurrency: c.nativeCurrency, rpcUrls: c.rpcUrls?.default?.http || [] }] });
      return true;
    } catch (e2) { toast(explain(e2), "err"); return false; }
  }
}
async function write(fn, args = [], value = 0n, okMsg = "Done") {
  if (!S.account) { toast("Connect a wallet first", "err"); return null; }
  if (S.busy) return null;
  if (CONFIRM_FNS[fn] || value > 0n) {
    const body = (CONFIRM_FNS[fn] || "This sends GEN to the contract.") + (value > 0n ? ` Amount: ${fmtGen(value)} GEN.` : "");
    if (!(await confirmBox("Please confirm", body))) return null;
  }
  S.busy = true; document.body.classList.add("busy");
  let stage = 0;
  try {
    if (!(await ensureNetwork())) return null;
    if (value > 0n && window.ethereum && !S.localKey) {
      try {
        const bal = BigInt(await window.ethereum.request({ method: "eth_getBalance", params: [S.account, "latest"] }));
        if (bal < value) { toast("Not enough GEN in this wallet. You need " + fmtGen(value) + " GEN plus fees.", "err"); return null; }
      } catch {}
    }
    paintTrack(0);
    const hash = await S.client.writeContract({ address: S.contract, functionName: fn, args, value });
    stage = 1; paintTrack(1);
    try {
      await S.client.waitForTransactionReceipt({ hash, status: "ACCEPTED", retries: 120, interval: 3000 });
      stage = 2; paintTrack(2);
      await S.client.waitForTransactionReceipt({ hash, status: "FINALIZED", retries: 40, interval: 3000 });
      stage = 3; paintTrack(3);
    } catch (e) { console.warn(e); }
    toast(okMsg, "good");
    setTimeout(() => paintTrack(-1), 1500);
    return hash;
  } catch (e) {
    paintTrack(stage, stage);
    toast(explain(e), "err");
    setTimeout(() => paintTrack(-1), 4000);
    return null;
  } finally { S.busy = false; document.body.classList.remove("busy"); }
}

function stepper(d) {
  const order = ["OPEN", "PAYMENT_CLAIMED", "ACTIVE", "DELIVERED", "COMPLETED"];
  let idx = order.indexOf(d.status);
  if (["DISPUTED", "REOPENED", "PAYOUT_PENDING", "CHALLENGED", "RESOLVED"].includes(d.status)) idx = 4;
  if (["CANCELLED", "EXPIRED"].includes(d.status)) idx = -1;
  return `<div class="steps">${order.map((_, i) => `<i class="${i < idx ? "d" : i === idx ? "c" : ""}"></i>`).join("")}</div>`;
}

  <div class="warn-box" style="font-size:.85rem">Only the protected amount is covered, not the price. The price text is not enforced by the contract.</div>
  <div class="card word">${info || ""}</div>
  <div class="card"><div class="row between"><span class="mut">Seller</span><a class="mono" href="#/seller/${esc(d.seller)}">${esc(short(d.seller))}</a></div>
  ${d.buyer ? `<div class="row between"><span class="mut">Buyer</span><span class="mono">${esc(short(d.buyer))}</span></div>` : ""}
  <div class="row between"><span class="mut">Bond locked</span><span>${fmtGen(d.lock)} GEN</span></div>
  <div class="row between"><span class="mut">Delivery window</span><span>${Math.round(d.delivery_secs / p.unit)} h</span></div>
  ${d.listing_url ? `<div class="row between"><span class="mut">Listing</span><a href="${safeHref(d.listing_url)}" target="_blank" rel="noopener noreferrer">open</a></div>` : ""}
  ${d.rejections ? `<div class="row between"><span class="mut">Earlier claims rejected</span><span>${d.rejections}</span></div>` : ""}</div>
  ${actions ? `<div class="card">${actions}</div>` : ""}
  ${ev.length ? `<h2>Evidence on record</h2>${ev.map(e => `<div class="ev ${esc(e.side)}"><b>${esc(e.side)}</b> <span class="mut">${ago(e.at)}</span><div>${esc(e.text)}</div>${e.url ? `<a href="${safeHref(e.url)}" target="_blank" rel="noopener noreferrer" class="word">${esc(e.url)}</a>` : ""}<div class="mono mut" style="font-size:.7rem">sha256 ${esc(e.digest.slice(0, 16))}…</div></div>`).join("")}` : ""}`);

  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  const go = async (fn, args, val, msg) => { if (await write(fn, args, val, msg)) route(); };
  on("#cancel", () => go("cancel_deal", [id], 0n, "Offer cancelled"));
  on("#expire", () => go("expire_offer", [id], 0n, "Offer released"));
  on("#claimpay", () => { const v = $("#pref").value.trim(); if (v.length < 5) return toast("Add a payment reference (5+ characters)", "err"); go("claim_payment", [id, v], BigInt(p.claim_deposit), "Payment claimed"); });
  on("#accept", () => go("respond_payment", [id, true, ""], 0n, "Deal is now binding"));
  on("#reject", () => { const v = $("#rrs").value.trim(); if (v.length < 5) return toast("Give a short reason", "err"); go("respond_payment", [id, false, v], 0n, "Claim rejected"); });
  on("#timeout", () => go("bind_by_timeout", [id], 0n, "Deal is now binding"));
  on("#deliver", () => { const v = $("#dtx").value.trim(); if (v.length < 3) return toast("Describe the delivery", "err"); go("submit_delivery", [id, v, $("#dur").value.trim()], 0n, "Delivery submitted"); });
  on("#confirm", () => go("confirm_delivery", [id], 0n, "Thanks — deal completed"));
  on("#finalize", () => go("finalize_deal", [id], 0n, "Deal closed"));
  on("#dispute", () => {
    const v = $("#dcl").value.trim(); if (v.length < 10) return toast("Describe the problem (10+ characters)", "err");
    go("open_dispute", [id, v, $("#dur2").value.trim()], BigInt(p.dispute_deposit), "Dispute opened");
  });
  on("#addev", () => { const v = $("#etx").value.trim(); if (v.length < 5) return toast("Write the evidence (5+ characters)", "err"); go("submit_evidence", [id, v, $("#eur").value.trim()], 0n, "Evidence recorded"); });
  on("#resolve", () => go("resolve_dispute", [id], 0n, "Arbitration finished"));
  on("#challenge", () => { const v = $("#ctx").value.trim(); if (v.length < 5) return toast("Explain the challenge (5+ characters)", "err"); go("challenge_payout", [id, v, $("#cur").value.trim()], 0n, "Payout challenged"); });
  on("#finpay", () => go("finalize_payout", [id], 0n, "Payout released"));
  on("#stalled", () => go("close_stalled_dispute", [id], 0n, "Dispute closed, deposit returned"));
}
function disputeForm(p) {
  return `<details style="margin-top:12px"><summary>Something is wrong — open a dispute</summary>
  <div class="warn-box" style="margin-top:8px">Needs a deposit of exactly ${fmtGen(p.dispute_deposit)} GEN. You get it back unless the verdict is SELLER_WINS. If the seller never confirmed your payment, include proof of payment in your claim; compensation is then capped at 25%.</div>
  <label>What happened?</label><textarea id="dcl" maxlength="1500"></textarea>
  <label>Evidence link (https, optional)</label><input id="dur2" maxlength="300">
  <button class="btn block" style="margin-top:10px" id="dispute">Open dispute</button></details>`;
}

async function pageNew() {
  const p = await getParams();
  let seller = null;
  if (S.account) seller = await readJson("get_seller", [S.account.toLowerCase()]).catch(() => null);
  if (!S.account) return view(`<h1>New deal</h1><div class="card"><p>Connect a wallet to create an offer.</p><button class="btn" id="c2">Connect</button></div>`), $("#c2").onclick = connect;
  if (!seller) return view(`<h1>New deal</h1><div class="card"><p>You need to be a registered seller first.</p><a class="btn" href="#/become">Become a seller</a></div>`);
  view(`<h1>New deal</h1>
  <div class="card"><div class="row between"><span class="mut">You can protect up to</span><b style="color:var(--teal)">${fmtGen(seller.available_protection)} GEN</b></div>
  <div class="mut" style="font-size:.85rem">Bond locked per deal: ${seller.lock_bps / 100}% of the protected amount.</div></div>
  <label>Item</label><input id="item" maxlength="200" placeholder="Red leather handbag, size M">
  <label>Price (shown to the buyer, e.g. “40 USD”)</label><input id="price" maxlength="80">
  <label>Listing link (https, optional)</label><input id="lurl" maxlength="300" placeholder="https://instagram.com/p/…">
  <label>Protected amount (whole GEN)</label><input id="prot" type="number" min="1" step="1" inputmode="numeric">
  <label>Delivery time (hours)</label><input id="hrs" type="number" min="1" max="720" step="1" value="72" inputmode="numeric">
  <button class="btn block" style="margin-top:16px" id="create">Create offer</button>`);
  $("#create").onclick = async () => {
    const item = $("#item").value.trim(), price = $("#price").value.trim();
    const prot = parseInt($("#prot").value, 10), hrs = parseInt($("#hrs").value, 10);
    if (item.length < 3 || !price || !(prot >= 1) || !(hrs >= 1)) return toast("Fill every required field", "err");
    if (await write("create_deal", [item, price, $("#lurl").value.trim(), BigInt(prot) * GEN, BigInt(hrs)], 0n, "Offer created")) location.hash = "#/seller/" + seller.handle;
  };
}

async function pageBecome() {
  const p = await getParams();
  view(`<h1>Become a <span class="sig">bonded</span> seller</h1>
  <p class="mut">Lock GEN as a bond. If you fail to deliver and lose a dispute, buyers are paid from it.</p>
  <div class="card">
  <div class="row between"><span>STARTER</span><span class="mut">${fmtGen(p.min_bond)}+ GEN · up to ${fmtGen(p.max_protect[0])} GEN per deal</span></div>
  <div class="row between"><span>VERIFIED</span><span class="mut">${fmtGen(p.verified_bond)}+ GEN · up to ${fmtGen(p.max_protect[1])} GEN</span></div>
  <div class="row between"><span>PREMIUM</span><span class="mut">${fmtGen(p.premium_bond)}+ GEN · up to ${fmtGen(p.max_protect[2])} GEN</span></div></div>
  <label>Handle (letters, numbers, _ and .; 3–30)</label><input id="handle" maxlength="30" autocapitalize="none" placeholder="my_shop">
  <label>Bond (whole GEN)</label><input id="bond" type="number" min="${fmtGen(p.min_bond)}" step="1" inputmode="numeric" value="${fmtGen(p.min_bond)}">
  <div class="warn-box" style="margin-top:12px">Your handle is a label you choose. BondMark does not prove you own the Instagram account with that name.</div>
  <button class="btn block" style="margin-top:14px" id="reg">Register and lock bond</button>`);
  $("#reg").onclick = async () => {
    const h = $("#handle").value.trim().toLowerCase();
    const n = parseInt($("#bond").value, 10);
    if (!/^[a-z0-9_.]{3,30}$/.test(h)) return toast("Invalid handle", "err");
    if (!(n >= Number(BigInt(p.min_bond) / GEN))) return toast("Bond is below the minimum", "err");
    if (await write("register_seller", [h], BigInt(n) * GEN, "Registered")) location.hash = "#/seller/" + h;
  };
}

async function pageMe() {
  if (!S.account) { view(`<h1>Me</h1><div class="card"><p>Connect a wallet to see your deals and balance.</p><button class="btn" id="c3">Connect</button></div>`); $("#c3").onclick = connect; return; }
  skeleton();
  const a = S.account.toLowerCase();
  const [cl, seller, deals] = await Promise.all([read("get_claimable", [a]), readJson("get_seller", [a]).catch(() => null), readJson("deals_of", [a])]);
  const amt = BigInt(cl || 0);
  view(`<h1>Me</h1><div class="mono mut word">${esc(S.account)}</div>
  <div class="card"><div class="row between"><div><div class="mut">Claimable balance</div><b style="font-size:1.5rem">${fmtGen(amt)} GEN</b></div>
  <button class="btn" id="claim" ${amt === 0n ? "disabled" : ""}>Claim</button></div></div>
  ${seller ? sellerCard(seller) : `<a class="btn sec block" href="#/become">Become a seller</a>`}
  <h2>My deals</h2>${deals.length ? deals.map(dealCard).join("") : '<div class="empty">No deals yet.</div>'}
  <p><a href="#/settings">Settings</a></p>`);
  $("#claim").onclick = async () => { if (await write("claim", [], 0n, "Sent to your wallet")) route(); };
}

async function pageHow() {
  const p = await getParams().catch(() => null);
  const h = t => Math.round(t / (p?.unit || 3600));
  view(`<h1>How BondMark works</h1>
  <div class="card"><b>1. Seller posts a bond</b><p class="mut">GEN is locked in the contract. The bond sets how much value one seller can protect.</p></div>
  <div class="card"><b>2. Seller lists a protected deal</b><p class="mut">A part of the bond (${p ? p.lock_bps_new / 100 : 150}% of the protected amount, less for proven sellers) stays locked until the deal ends.</p></div>
  <div class="card"><b>3. Buyer pays off-chain, then claims</b><p class="mut">Pay by bank transfer, cash app or anything the seller accepts. Paste the payment reference. The seller can accept or reject. If they stay silent for ${p ? h(p.confirm_window) : 24} h, the deal binds anyway.</p></div>
  <div class="card"><b>4. Delivery</b><p class="mut">The seller submits delivery proof. The buyer confirms, or after ${p ? h(p.review_window) : 72} h it completes on its own.</p></div>
  <div class="card"><b>5. Dispute</b><p class="mut">The buyer puts down a ${p ? fmtGen(p.dispute_deposit) : 1} GEN deposit. Both sides add up to 3 pieces of evidence. Validators read the frozen evidence and reach consensus: buyer wins (full protected amount), split (half), seller wins, or not enough evidence (one more round, then no payout).</p></div>
  <h2>What it cannot do</h2>
  <div class="warn-box"><ul style="margin:0;padding-left:18px">
  <li>It cannot see your bank. Payments and parcels are judged only from evidence people submit.</li>
  <li>Handles are not verified accounts.</li>
  <li>When the seller stays silent about a payment, any compensation is capped at 25%, needs reviewed payment proof, and is paid only after a 7-day window in which the seller can challenge.</li>
  <li>Claiming a payment needs a refundable deposit; it is burned (paid to nobody) if the seller rejects the claim.</li>
  <li>Compensation is paid in GEN to the buyer's wallet and covers the protected amount, not necessarily the full price.</li>
  <li>Validators are language models. They can be wrong. There is no appeal in this version.</li>
  <li>This is a testnet prototype. Do not use real money.</li></ul></div>`);
}

async function pageSettings() {
  view(`<h1>Settings</h1>
  <div class="card"><label>Contract address</label><input id="caddr" class="mono" value="${esc(S.contract)}" placeholder="0x…">
  <button class="btn block" style="margin-top:10px" id="save">Save</button>
  <p class="mut" style="font-size:.85rem">Network: GenLayer Studio. You can also open this page with <code>?c=0x…</code>.</p></div>`);
  $("#save").onclick = () => {
    const v = $("#caddr").value.trim();
    if (!validAddr(v)) return toast("Not a valid address", "err");
    safeStore.set("bm_contract", v); S.contract = v; S.params = null; toast("Saved", "good"); location.hash = "#/";
  };
}

async function route() {
  const h = location.hash || "#/";
  paintTabs(h);
  const parts = h.slice(2).split("/");
  try {
    if (parts[0] !== "settings" && parts[0] !== "how" && !validAddr(S.contract)) return pageSettings();
    switch (parts[0]) {
      case "": return await pageHome();
      case "sellers": return await pageSellers();
      case "seller": return await pageSeller(decodeURIComponent(parts[1] || ""));
      case "deal": return await pageDeal(decodeURIComponent(parts[1] || ""));
      case "new": return await pageNew();
      case "become": return await pageBecome();
      case "me": return await pageMe();
      case "how": return await pageHow();
      case "settings": return await pageSettings();
      default: return await pageHome();
    }
  } catch (e) { console.error(e); errBox(e); }
}
window.addEventListener("hashchange", route);
paintWallet();
route();
if (safeStore.get("bm_auto") && window.ethereum) {
  window.ethereum.request({ method: "eth_accounts" }).then(async acc => {
    if (acc && acc[0]) { S.account = acc[0]; const sdk = await loadSdk(); S.client = sdk.createClient({ chain: sdk.studionet, account: acc[0] }); paintWallet(); route(); }
  }).catch(() => {});
}
</script>
</body>
</html>
