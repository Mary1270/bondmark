<html lang="en">
<head>

<meta name="description" content="Seller bonds and on-chain dispute resolution for social commerce, on Base.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B7A6B'/%3E%3Cpath d='M16 5l9 4v7c0 5-4 9-9 11-5-2-9-6-9-11V9z' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M12 16l3 3 5-6' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">

<style>
:root{--bg:#F5F7F8;--surface:#FFFFFF;--surface2:#EEF2F3;--line:#DDE3E6;--tx:#12181C;--mut:#56626B;--sig:#0B7A6B;--sig-ink:#FFFFFF;--sig-soft:#E1F3F0;--ok:#16794F;--warn:#9A6200;--bad:#B3261E;--shadow:0 1px 2px rgba(16,24,28,.06),0 4px 14px rgba(16,24,28,.06);--r:12px;--pri:var(--sig);--teal:var(--sig);--bg2:var(--surface2);--card:var(--surface)}
:root[data-theme=dark]{--bg:#0E1417;--surface:#151D21;--surface2:#1B262B;--line:#26343A;--tx:#E8EEF0;--mut:#9AA9B0;--sig:#3DD6BD;--sig-ink:#06201B;--sig-soft:#123A35;--ok:#4FD39A;--warn:#F0B54A;--bad:#FF8A80;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;padding-bottom:76px}
a{color:var(--sig);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;color:var(--tx)}
.logo:hover{text-decoration:none}
.logo svg{width:26px;height:26px}
.grow{flex:1;min-width:0}
.shell{max-width:1120px;margin:0 auto;display:block}
aside.side{display:none}
main{padding:16px;min-width:0}
h1{font-size:1.7rem;line-height:1.2;margin:.2em 0 .3em;letter-spacing:-.015em;font-weight:700}
h2{font-size:1.1rem;margin:1.6em 0 .5em;font-weight:700}
h3{font-size:1rem;margin:0 0 4px}
.mut{color:var(--mut)}
.sig{color:var(--sig)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
a.card{display:block;color:var(--tx);border-top:3px solid var(--line)}
a.card:hover{text-decoration:none;border-color:var(--sig)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);color:var(--mut);white-space:nowrap;background:var(--surface)}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.pill.ok{color:var(--ok);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}.pill.bad{color:var(--bad);border-color:currentColor}.pill.pri{color:var(--sig);border-color:currentColor}
.btn{appearance:none;border:1px solid var(--sig);border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;color:var(--sig-ink);background:var(--sig);cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{text-decoration:none;filter:brightness(1.05)}
.btn.sec{background:var(--surface);color:var(--tx);border-color:var(--line)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:.92rem}
.btn:disabled,body.busy .btn{opacity:.55;pointer-events:none}
.btn.block{width:100%}
.iconbtn{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,textarea,select{width:100%;background:var(--surface);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus,.btn:focus-visible,.iconbtn:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-size:1.2rem}
.stat span{font-size:.8rem;color:var(--mut)}
.stat small{display:block;font-size:.75rem;margin-top:2px;color:var(--sig)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{max-width:760px;margin:0 auto;display:flex}
nav.tabs a{flex:1;text-align:center;padding:8px 2px;color:var(--mut);font-size:.72rem;min-height:48px}
nav.tabs a:hover{text-decoration:none}
nav.tabs a svg,aside.side a svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a.on{color:var(--sig);font-weight:600}
aside.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--tx);border:1px solid transparent;margin-bottom:4px}
aside.side a svg{margin:0;width:20px;height:20px}
aside.side a:hover{text-decoration:none;background:var(--surface2)}
aside.side a.on{border-color:var(--sig);color:var(--sig);font-weight:600}
.toast{position:fixed;left:16px;right:16px;bottom:92px;z-index:60;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sig);padding:12px 14px;border-radius:10px;box-shadow:var(--shadow)}
.toast.err{border-left-color:var(--bad)}.toast.good{border-left-color:var(--ok)}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--sig)}
.steps{display:flex;gap:4px;margin:10px 0}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.d{background:var(--sig)}.steps i.c{background:var(--sig);opacity:.55}
.ev{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;background:var(--surface2);border-radius:0 10px 10px 0;word-break:break-word}
.ev.buyer{border-color:var(--warn)}.ev.seller{border-color:var(--sig)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.warn-box{border:1px solid var(--warn);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.9rem}
.sk{height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
details{margin:8px 0}summary{cursor:pointer;color:var(--sig);min-height:36px;display:flex;align-items:center}
code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:var(--surface2);padding:1px 6px;border-radius:6px;word-break:break-all}
.word{word-break:break-word}
.hero{display:grid;gap:16px;align-items:center;padding:8px 0}
.hero p.lede{color:var(--mut);margin:.3em 0 1em;max-width:52ch}
.hero svg.art{width:100%;max-width:320px;height:auto;justify-self:center;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero svg.art,.sk{animation:none}}
.live{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:.8rem;color:var(--mut)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.live.on i{background:var(--ok)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.roles{display:grid;gap:10px}
.role{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;color:var(--tx);box-shadow:var(--shadow)}
.role:hover{border-color:var(--sig);text-decoration:none}
.tile{width:48px;height:48px;border-radius:12px;background:var(--sig-soft);display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{width:26px;height:26px;stroke:var(--sig);fill:none;stroke-width:1.8}
.role .arrow{margin-left:auto;color:var(--sig);font-size:1.3rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:.95rem;min-height:38px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--sig);color:var(--sig);text-decoration:none}
.feed .item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed .item:last-child{border-bottom:0}
.feed .dot{width:9px;height:9px;border-radius:50%;background:var(--sig);margin-top:7px;flex:none}
.how4{display:grid;gap:10px}
.how4 .card{margin:0}
.how4 .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--sig-soft);color:var(--sig);font-weight:700;align-items:center;justify-content:center;margin-bottom:6px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--tx);padding:18px;max-width:min(92vw,440px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.track div{font-size:.72rem;text-align:center;color:var(--mut);border-top:4px solid var(--line);padding-top:6px}
.track div.d{border-color:var(--sig);color:var(--tx)}
.track div.c{border-color:var(--sig);opacity:.6}
.track div.x{border-color:var(--bad);color:var(--bad)}
.txbox{position:fixed;left:16px;right:16px;bottom:92px;z-index:55;max-width:560px;margin:0 auto}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}.roles{grid-template-columns:repeat(3,1fr)}.how4{grid-template-columns:repeat(4,1fr)}.hero{grid-template-columns:1.2fr .8fr}}
@media (min-width:1024px){body{padding-bottom:0}nav.tabs{display:none}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:8px}aside.side{display:block;padding:16px 8px 16px 16px;position:sticky;top:60px;align-self:start}main{padding:20px 16px 40px}.toast,.txbox{bottom:24px}}
@media (max-width:480px){#net{display:none}}
</style>
<script>try{var m=localStorage.getItem("bm_theme");if(m)document.documentElement.setAttribute("data-theme",m);else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>

<body>
<header class="top"><div class="bar">
<a class="logo" href="#/"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l11 5v8c0 6-5 10-11 13C10 26 5 22 5 16V8z" fill="none" stroke="var(--sig)" stroke-width="2.4"/><path d="M11 16l4 4 6-8" fill="none" stroke="var(--sig)" stroke-width="2.6"/></svg>BondMark</a>
<div class="grow"></div>
<span class="pill pri" id="net"></span>
<button class="iconbtn" id="themebtn" aria-label="Toggle light and dark theme"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg></button>
<button class="btn sm sec" id="wbtn">Connect</button>
</div></header>
<div class="shell"><aside class="side" id="side"></aside><main id="app"></main></div>
<nav class="tabs"><div id="tabs"></div></nav>
<div id="toast"></div><div id="tx"></div>
<dialog id="dlg"></dialog>

<script type="module">
import { createPublicClient, createWalletClient, custom, http, parseAbi, parseEther, formatEther } from "https://esm.sh/viem@2";
import { base, baseSepolia } from "https://esm.sh/viem@2/chains";

const DEFAULT_ADDRESS = "ADDRESS";
const ABI = parseAbi([
  "struct Deal { uint256 id; address seller; address buyer; string item; string priceText; string listingUrl; uint256 protect; uint256 lock; uint256 deliverySecs; uint8 status; uint64 createdAt; uint64 offerExpires; uint64 claimedAt; string paymentRef; uint64 boundAt; uint8 boundBy; uint64 deliveryDeadline; uint64 deliveredAt; string deliveryText; string deliveryUrl; uint32 rejections; string rejectReason; uint256 deposit; uint64 evidenceDeadline; bool reopened; uint8 evBuyer; uint8 evSeller; uint8 verdict; bytes32 reasonCode; string reason; uint256 compensation; uint256 fee; uint64 resolvedAt; bool paymentEvidenceReviewed; uint256 claimDeposit; uint256 pendingComp; uint64 unlockAt; bool challenged; }",
  "struct Evidence { bool byBuyer; string text; string url; bytes32 digest; uint64 at; }",
  "struct SellerInfo { address owner; string handle; uint256 bond; uint256 locked; uint256 available; uint256 maxProtect; uint256 score; uint256 lockBps; uint8 level; bool trusted; uint256 compensated; uint32 dealsBound; uint32 completedVerified; uint32 completedAuto; uint32 disputesLost; uint32 disputesSplit; uint32 disputesWon; uint32 inconclusive; uint32 rejectedClaims; uint32 lapsed; uint32 activeDeals; uint32 uniqueBuyers; }",
  "function registerSeller(string handle) payable",
  "function addBond() payable",
  "function withdrawBond(uint256 amount)",
  "function createDeal(string item, string priceText, string listingUrl, uint256 protect, uint256 deliveryHours) returns (uint256)",
  "function cancelDeal(uint256 id)",
  "function expireOffer(uint256 id)",
  "function claimPayment(uint256 id, string paymentRef) payable",
  "function challengePayout(uint256 id, string text, string url)",
  "function finalizePayout(uint256 id)",
  "function respondPayment(uint256 id, bool accept, string reason)",
  "function bindByTimeout(uint256 id)",
  "function submitDelivery(uint256 id, string text, string url)",
  "function confirmDelivery(uint256 id)",
  "function finalizeDeal(uint256 id)",
  "function openDispute(uint256 id, string claimText, string url) payable",
  "function submitEvidence(uint256 id, string text, string url)",
  "function resolveTimeout(uint256 id)",
  "function claim()",
  "function getDeal(uint256 id) view returns (Deal)",
  "function getEvidence(uint256 id) view returns (Evidence[])",
  "function sellerInfo(address who) view returns (SellerInfo)",
  "function isSeller(address who) view returns (bool)",
  "function sellerByHandle(string handle) view returns (address)",
  "function sellerCount() view returns (uint256)",
  "function sellerAt(uint256 i) view returns (address)",
  "function dealCount() view returns (uint256)",
  "function totalBonds() view returns (uint256)",
  "function totalClaimable() view returns (uint256)",
  "function depositsHeld() view returns (uint256)",
  "function burned() view returns (uint256)",
  "function claimable(address who) view returns (uint256)",
  "function arbiter() view returns (address)",
  "function unit() view returns (uint256)",
  "function confirmWindow() view returns (uint256)",
  "function reviewWindow() view returns (uint256)",
  "function arbiterTimeout() view returns (uint256)",
  "function MIN_BOND() view returns (uint256)",
  "function VERIFIED_BOND() view returns (uint256)",
  "function PREMIUM_BOND() view returns (uint256)",
  "function MAX_PROTECT_STARTER() view returns (uint256)",
  "function MAX_PROTECT_VERIFIED() view returns (uint256)",
  "function MAX_PROTECT_PREMIUM() view returns (uint256)",
  "function DISPUTE_DEPOSIT() view returns (uint256)",
  "function CLAIM_DEPOSIT() view returns (uint256)",
  "function LOCK_BPS_NEW() view returns (uint256)"
]);

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const CHAINS = { sepolia: baseSepolia, mainnet: base };
const qs = new URLSearchParams(location.search);
{
  const reqC = qs.get("c");
  if (reqC && /^0x[0-9a-fA-F]{40}$/.test(reqC) && reqC.toLowerCase() !== String(store.get("bmb_contract") || "").toLowerCase()) {
    let ok = false;
    try { ok = window.confirm("This link wants BondMark to use a different contract:\n" + reqC + "\n\nOnly continue if you trust whoever sent it. Anything you send goes to that contract."); } catch {}
    if (ok) store.set("bmb_contract", reqC);
  }
}
if (qs.get("n") && CHAINS[qs.get("n")]) store.set("bmb_net", qs.get("n"));
const S = { contract: store.get("bmb_contract") || DEFAULT_ADDRESS, net: store.get("bmb_net") || "sepolia", account: null, provider: null, busy: false, params: null, mini: null };
const chain = () => CHAINS[S.net] || baseSepolia;
const pub = () => (S.pc ||= createPublicClient({ chain: chain(), transport: http() }));
const validAddr = a => /^0x[0-9a-fA-F]{40}$/.test(a || "");
const ZERO = "0x0000000000000000000000000000000000000000";
const N = x => Number(x);
const eth = v => { const s = formatEther(BigInt(v || 0)); return s.includes(".") ? s.replace(/0+$/, "").replace(/\.$/, "") : s; };
const safeHref = u => /^https:\/\/[^\s"'<>\\]+$/.test(String(u)) ? esc(u) : "#";
const short = a => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
const fmtTime = t => t ? new Date(N(t) * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "—";
const now = () => Math.floor(Date.now() / 1000);
const ago = t => {
  t = N(t); if (!t) return "—";
  const d = now() - t, a = Math.abs(d);
  const u = a < 3600 ? [Math.max(1, Math.round(a / 60)), "min"] : a < 86400 ? [Math.round(a / 3600), "h"] : [Math.round(a / 86400), "d"];
  return d >= 0 ? `${u[0]}${u[1]} ago` : `in ${u[0]}${u[1]}`;
};
const STATUS = [["Open", "pri"], ["Payment claimed", "warn"], ["Awaiting delivery", "pri"], ["Delivered", "pri"], ["Completed", "ok"], ["In dispute", "bad"], ["Dispute reopened", "bad"], ["Resolved", "warn"], ["Cancelled", ""], ["Expired", ""], ["Payout pending", "warn"], ["Payout challenged", "bad"]];
const ST = { OPEN: 0, CLAIMED: 1, ACTIVE: 2, DELIVERED: 3, COMPLETED: 4, DISPUTED: 5, REOPENED: 6, RESOLVED: 7, CANCELLED: 8, EXPIRED: 9, PAYOUT_PENDING: 10, CHALLENGED: 11 };
const VERDICT = ["", "Buyer wins", "Seller wins", "Split", "Insufficient evidence"];
const LEVEL = ["STARTER", "VERIFIED", "PREMIUM"];
const pill = s => { const [l, k] = STATUS[N(s)]; return `<span class="pill ${k}">${l}</span>`; };
const levelPill = l => `<span class="pill ${N(l) === 2 ? "pri" : N(l) === 1 ? "ok" : ""}">${LEVEL[N(l)]}</span>`;
const hexText = h => { try { return h.replace(/^0x/, "").replace(/(00)+$/, "").match(/.{2}/g)?.map(b => String.fromCharCode(parseInt(b, 16))).join("") || ""; } catch { return ""; } };

function toast(msg, kind = "") {
  const t = $("#toast");
  t.innerHTML = `<div class="toast ${kind}">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.innerHTML = "", kind === "err" ? 7000 : 3500);
}

async function read(functionName, args = []) {
  if (!validAddr(S.contract)) throw new Error("Contract address is not set. Open Settings.");
  return pub().readContract({ address: S.contract, abi: ABI, functionName, args });
}
const CONFIRM_FNS = {
  withdrawBond: "Move this part of your bond to your claimable balance?",
  claim: "Send your claimable balance to your wallet?",
  respondPayment: "Answer this payment claim? Rejecting burns the buyer's claim deposit.",
  challengePayout: "Challenge the pending payout? The ruling is re-reviewed once.",
  finalizePayout: "Release the pending payout to the buyer?",
  resolveTimeout: "Close this dispute as inconclusive and return deposits?",
  confirmDelivery: "Confirm you received the item? This completes the deal and cannot be undone.",
  registerSeller: "Register and lock this bond in the contract?",
  addBond: "Lock this extra bond in the contract?",
  claimPayment: "Claim the payment and put down the claim deposit?",
  openDispute: "Open a dispute and put down the dispute deposit?"
};
function confirmBox(title, body) {
  const d = $("#dlg");
  d.innerHTML = `<h3>${esc(title)}</h3><p class="mut">${esc(body)}</p><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec sm" value="no">Cancel</button><button class="btn sm" value="yes">Confirm</button></div>`;
  return new Promise(res => {
    d.onclose = () => res(d.returnValue === "yes");
    d.onclick = e => { if (e.target === d) d.close("no"); };
    for (const b of d.querySelectorAll("button")) b.onclick = () => d.close(b.value);
    try { d.returnValue = ""; d.showModal(); } catch { res(window.confirm(title + "\n\n" + body)); }
  });
}
function paintTrack(stage, fail) {
  const names = ["Signature", "Submitted", "Accepted", "Finalized"];
  $("#tx").innerHTML = stage < 0 ? "" : `<div class="card txbox"><div class="track">${names.map((n, i) => `<div class="${fail === i ? "x" : i < stage ? "d" : i === stage ? "c" : ""}">${n}</div>`).join("")}</div></div>`;
}
function explain(e) {
  const m = String(e?.shortMessage || e?.message || e || "");
  if (e?.code === 4001 || /user (rejected|denied)|rejected the request/i.test(m)) return "You declined the request in your wallet. Nothing was sent.";
  if (/insufficient funds|exceeds the balance/i.test(m)) return "Not enough ETH in this wallet for the amount plus gas.";
  if (/chain/i.test(m) && /mismatch|switch|wrong|unrecognized|not added/i.test(m)) return "Your wallet is on the wrong network. Switch to " + (S.net === "mainnet" ? "Base" : "Base Sepolia") + " and try again.";
  const r = m.match(/reverted with the following reason:\s*(.+?)(?:\n|$)/i) || m.match(/reason:\s*(.+?)(?:\n|$)/i);
  if (r) return "The contract refused this action: " + r[1].trim().slice(0, 200);
  return m.slice(0, 220) || "Transaction failed";
}
async function write(functionName, args = [], value = 0n, okMsg = "Done") {
  if (!S.account) { toast("Connect a wallet first", "err"); return null; }
  if (S.busy) return null;
  if (CONFIRM_FNS[functionName] || value > 0n) {
    const body = (CONFIRM_FNS[functionName] || "This sends ETH to the contract.") + (value > 0n ? ` Amount: ${eth(value)} ETH.` : "");
    if (!(await confirmBox("Please confirm", body))) return null;
  }
  S.busy = true; document.body.classList.add("busy");
  let stage = 0;
  try {
    const wc = createWalletClient({ chain: chain(), transport: custom(S.provider), account: S.account });
    try {
      const have = parseInt(await S.provider.request({ method: "eth_chainId" }), 16);
      if (have !== chain().id) {
        if (!(await confirmBox("Wrong network", "Your wallet is on another network. Switch to " + (S.net === "mainnet" ? "Base" : "Base Sepolia") + "?"))) return null;
        try { await wc.switchChain({ id: chain().id }); } catch (e) { await wc.addChain({ chain: chain() }); }
      }
    } catch (e) { toast(explain(e), "err"); return null; }
    if (value > 0n) {
      try {
        const bal = await pub().getBalance({ address: S.account });
        if (bal < value) { toast("Not enough ETH in this wallet. You need " + eth(value) + " ETH plus gas.", "err"); return null; }
      } catch {}
    }
    paintTrack(0);
    const hash = await wc.writeContract({ address: S.contract, abi: ABI, functionName, args, value });
    stage = 1; paintTrack(1);
    const rc = await pub().waitForTransactionReceipt({ hash });
    stage = 2; paintTrack(2);
    if (rc.status === "reverted") throw new Error("The transaction was mined but reverted.");
    stage = 3; paintTrack(3);
    toast(okMsg, "good");
    setTimeout(() => paintTrack(-1), 1500);
    return hash;
  } catch (e) {
    paintTrack(stage, stage);
    toast(explain(e), "err");
    setTimeout(() => paintTrack(-1), 4000);
    return null;
  } finally { S.busy = false; document.body.classList.remove("busy"); }
}

function stepper(d) {
  const order = [ST.OPEN, ST.CLAIMED, ST.ACTIVE, ST.DELIVERED, ST.COMPLETED];
  let idx = order.indexOf(N(d.status));
  if ([ST.DISPUTED, ST.REOPENED, ST.PAYOUT_PENDING, ST.CHALLENGED, ST.RESOLVED].includes(N(d.status))) idx = 4;
  if ([ST.CANCELLED, ST.EXPIRED].includes(N(d.status))) idx = -1;
  return `<div class="steps">${order.map((_, i) => `<i class="${i < idx ? "d" : i === idx ? "c" : ""}"></i>`).join("")}</div>`;
}

async function pageDeal(idStr) {
  skeleton();

  const st = N(d.status);
  const ev = [ST.DISPUTED, ST.REOPENED, ST.PAYOUT_PENDING, ST.CHALLENGED, ST.RESOLVED].includes(st) ? await read("getEvidence", [id]) : [];
  const me = (S.account || "").toLowerCase();
  const isSeller = me && me === d.seller.toLowerCase(), isBuyer = me && d.buyer !== ZERO && me === d.buyer.toLowerCase();
  const t = now(), review = N(p.reviewWindow), confirm = N(p.confirmWindow);
  let info = "", actions = "";
  if (st === ST.OPEN) {
    info = `Offer open until ${fmtTime(d.offerExpires)}.`;
    if (isSeller) actions = `<button class="btn sec block" id="cancel">Cancel offer</button>`;
    else if (t > N(d.offerExpires)) actions = `<button class="btn sec block" id="expire">Release expired offer</button>`;
    else actions = `<div class="warn-box">Pay the seller off-chain first (bank, card, whatever they use). Then paste your payment reference here.</div>
      <label>Payment reference</label><input id="pref" maxlength="300" placeholder="Transfer ID, receipt number, last digits…">
      <div class="warn-box" style="margin-top:8px">Claiming needs a deposit of exactly ${eth(p.CLAIM_DEPOSIT)} ETH. You get it back when the deal completes. If the seller rejects the claim, it is burned (paid to nobody).</div>
      <button class="btn block" style="margin-top:10px" id="claimpay">I paid — claim payment (${eth(p.CLAIM_DEPOSIT)} ETH deposit)</button>`;
  } else if (st === ST.CLAIMED) {
    const dl = N(d.claimedAt) + confirm;
    info = `Payment reference: <span class="mono word">${esc(d.paymentRef)}</span><br>Seller must answer by ${fmtTime(dl)}. If they stay silent the deal binds automatically.`;
    if (isSeller) actions = `<button class="btn block" id="accept">Payment received — accept</button>
      <label>Or reject (reason)</label><input id="rrs" maxlength="200" placeholder="Why this payment is not valid"><button class="btn sec block" style="margin-top:10px" id="reject">Reject claim</button>`;
    else if (t >= dl) actions = `<button class="btn block" id="timeout">Bind deal (seller silent)</button>`;
  } else if (st === ST.ACTIVE) {
    const dd = N(d.deliveryDeadline);
    info = `Bound by ${["", "seller", "timeout"][N(d.boundBy)]}. Delivery deadline ${fmtTime(dd)} (${ago(dd)}).${N(d.boundBy) === 2 ? '<br><span class="pill warn">Seller never confirmed payment</span> Compensation is capped at 25% of the protected amount and needs reviewed payment proof.' : ""}`;
    if (isSeller) actions = `<label>Delivery proof (tracking number, details)</label><textarea id="dtx" maxlength="1500"></textarea>
      <label>Proof link (https, optional)</label><input id="dur" maxlength="300" placeholder="https://…">
      <button class="btn block" style="margin-top:10px" id="deliver">Submit delivery</button>`;
    if (isBuyer && t > dd && t <= dd + review) actions += disputeForm(p);
    if (t > dd + review) actions += `<button class="btn sec block" style="margin-top:10px" id="finalize">Close lapsed deal</button>`;
  } else if (st === ST.DELIVERED) {
    const rv = N(d.deliveredAt) + review;
    info = `Seller says delivered ${ago(d.deliveredAt)}.<br><span class="word">${esc(d.deliveryText)}</span>${d.deliveryUrl ? `<br><a href="${safeHref(d.deliveryUrl)}" target="_blank" rel="noopener noreferrer">Proof link</a>` : ""}<br>Buyer can confirm or dispute until ${fmtTime(rv)}.`;
    if (isBuyer && t <= rv) actions = `<button class="btn block" id="confirm">I received it — confirm</button>` + disputeForm(p);
    else if (t > rv) actions = `<button class="btn sec block" id="finalize">Complete deal (review window ended)</button>`;
  } else if (st === ST.PAYOUT_PENDING) {
    const ul = N(d.unlockAt);
    info = `<b>Ruling: ${VERDICT[N(d.verdict)]}</b> (payment was never confirmed by the seller)<br><span class="word">${esc(d.reason)}</span><br>Pending payout ${eth(d.pendingComp)} ETH. It unlocks ${fmtTime(ul)} (${ago(ul)}). The seller can challenge until then.`;

    const ed = N(d.evidenceDeadline);
    info = `Evidence closes ${fmtTime(ed)} (${ago(ed)}). Then the arbiter <span class="mono">${esc(short(p.arbiter))}</span> rules.${st === ST.REOPENED ? "<br>The first review found too little evidence. Both sides get one more chance." : st === ST.CHALLENGED ? "<br>The seller challenged the pending payout. The arbiter will re-review; a buyer ruling is then paid immediately (still capped)." : ""}`;
    if (t <= ed && (isBuyer || isSeller)) actions = `<label>Add evidence</label><textarea id="etx" maxlength="1500"></textarea>
      <label>Evidence link (https, optional)</label><input id="eur" maxlength="300"><button class="btn block" style="margin-top:10px" id="addev">Submit evidence</button>`;
    if (t > ed + N(p.arbiterTimeout)) actions = `<button class="btn sec block" id="atimeout">Arbiter silent — close as inconclusive</button>`;
  } else if (st === ST.RESOLVED) {
    info = `<b>${VERDICT[N(d.verdict)]}</b>${d.reason ? `<br><span class="word">${esc(d.reason)}</span>` : ""}<br>Reason code: <span class="mono">${esc(hexText(d.reasonCode))}</span><br>Compensation ${eth(d.compensation)} ETH · fee ${eth(d.fee)} ETH${N(d.boundBy) === 2 ? `<br>Payment unconfirmed by seller · cap 25% · payment evidence reviewed: ${d.paymentEvidenceReviewed ? "yes" : "no"}` : ""}`;
  } else if (st === ST.COMPLETED) info = "Deal completed.";
  else info = st === ST.CANCELLED ? "Offer cancelled." : "Expired.";

  view(`<div class="row between"><a href="#/" class="mut">← Deals</a>${pill(d.status)}</div>
  <h1 class="word">${esc(d.item)}</h1>${stepper(d)}
  <div class="grid">
    <div class="stat"><b>${esc(d.priceText)}</b><span>Price (display only)</span></div>
    <div class="stat"><b style="color:var(--teal)">${eth(d.protect)} ETH</b><span>Protected amount</span></div>
  </div>
  <div class="warn-box" style="font-size:.85rem">Only the protected amount is covered, not the price. The price text is not enforced by the contract.</div>
  <div class="card word">${info}</div>
  <div class="card"><div class="row between"><span class="mut">Seller</span><a class="mono" href="#/seller/${esc(d.seller)}">${esc(short(d.seller))}</a></div>
  ${d.buyer !== ZERO ? `<div class="row between"><span class="mut">Buyer</span><span class="mono">${esc(short(d.buyer))}</span></div>` : ""}
  <div class="row between"><span class="mut">Bond locked</span><span>${eth(d.lock)} ETH</span></div>
  <div class="row between"><span class="mut">Delivery window</span><span>${Math.round(N(d.deliverySecs) / N(p.unit))} h</span></div>
  ${d.listingUrl ? `<div class="row between"><span class="mut">Listing</span><a href="${safeHref(d.listingUrl)}" target="_blank" rel="noopener noreferrer">open</a></div>` : ""}
  ${N(d.rejections) ? `<div class="row between"><span class="mut">Earlier claims rejected</span><span>${d.rejections}</span></div>` : ""}</div>
  ${actions ? `<div class="card">${actions}</div>` : ""}
  ${ev.length ? `<h2>Evidence on record</h2>${ev.map(e => `<div class="ev ${e.byBuyer ? "buyer" : "seller"}"><b>${e.byBuyer ? "buyer" : "seller"}</b> <span class="mut">${ago(e.at)}</span><div>${esc(e.text)}</div>${e.url ? `<a href="${safeHref(e.url)}" target="_blank" rel="noopener noreferrer" class="word">${esc(e.url)}</a>` : ""}<div class="mono mut" style="font-size:.7rem">keccak ${esc(e.digest.slice(0, 18))}…</div></div>`).join("")}` : ""}`);

  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  const go = async (fn, args, val, msg) => { if (await write(fn, args, val, msg)) route(); };
  on("#cancel", () => go("cancelDeal", [id], 0n, "Offer cancelled"));
  on("#expire", () => go("expireOffer", [id], 0n, "Offer released"));
  on("#claimpay", () => { const v = $("#pref").value.trim(); if (v.length < 5) return toast("Add a payment reference (5+ characters)", "err"); go("claimPayment", [id, v], BigInt(p.CLAIM_DEPOSIT), "Payment claimed"); });
  on("#accept", () => go("respondPayment", [id, true, ""], 0n, "Deal is now binding"));
  on("#reject", () => { const v = $("#rrs").value.trim(); if (v.length < 5) return toast("Give a short reason", "err"); go("respondPayment", [id, false, v], 0n, "Claim rejected"); });
  on("#timeout", () => go("bindByTimeout", [id], 0n, "Deal is now binding"));
  on("#deliver", () => { const v = $("#dtx").value.trim(); if (v.length < 3) return toast("Describe the delivery", "err"); go("submitDelivery", [id, v, $("#dur").value.trim()], 0n, "Delivery submitted"); });
  on("#confirm", () => go("confirmDelivery", [id], 0n, "Thanks — deal completed"));
  on("#finalize", () => go("finalizeDeal", [id], 0n, "Deal closed"));
  on("#dispute", () => { const v = $("#dcl").value.trim(); if (v.length < 10) return toast("Describe the problem (10+ characters)", "err"); go("openDispute", [id, v, $("#dur2").value.trim()], BigInt(p.DISPUTE_DEPOSIT), "Dispute opened"); });
  on("#addev", () => { const v = $("#etx").value.trim(); if (v.length < 5) return toast("Write the evidence (5+ characters)", "err"); go("submitEvidence", [id, v, $("#eur").value.trim()], 0n, "Evidence recorded"); });
  on("#challenge", () => { const v = $("#ctx").value.trim(); if (v.length < 5) return toast("Explain the challenge (5+ characters)", "err"); go("challengePayout", [id, v, $("#cur").value.trim()], 0n, "Payout challenged"); });
  on("#finpay", () => go("finalizePayout", [id], 0n, "Payout released"));
  on("#atimeout", () => go("resolveTimeout", [id], 0n, "Closed as inconclusive"));
}

async function pageNew() {
  if (!S.account) { view(`<h1>New deal</h1><div class="card"><p>Connect a wallet to create an offer.</p><button class="btn" id="c2">Connect</button></div>`); $("#c2").onclick = connect; return; }
  const seller = await read("sellerInfo", [S.account]);
  if (!(await read("isSeller", [S.account]))) return view(`<h1>New deal</h1><div class="card"><p>You need to be a registered seller first.</p><a class="btn" href="#/become">Become a seller</a></div>`);
  view(`<h1>New deal</h1>
  <div class="card"><div class="row between"><span class="mut">You can protect up to</span><b style="color:var(--teal)">${eth(seller.available)} ETH</b></div>
  <div class="mut" style="font-size:.85rem">Bond locked per deal: ${N(seller.lockBps) / 100}% of the protected amount.</div></div>
  <label>Item</label><input id="item" maxlength="200" placeholder="Red leather handbag, size M">
  <label>Price (shown to the buyer, e.g. “40 USD”)</label><input id="price" maxlength="80">
  <label>Listing link (https, optional)</label><input id="lurl" maxlength="300" placeholder="https://instagram.com/p/…">
  <label>Protected amount (ETH)</label><input id="prot" inputmode="decimal" placeholder="0.002">
  <label>Delivery time (hours)</label><input id="hrs" type="number" min="1" max="720" step="1" value="72" inputmode="numeric">
  <button class="btn block" style="margin-top:16px" id="create">Create offer</button>`);
  $("#create").onclick = async () => {
    const item = $("#item").value.trim(), price = $("#price").value.trim(), hrs = parseInt($("#hrs").value, 10);
    let prot; try { prot = parseEther($("#prot").value.trim()); } catch { prot = 0n; }
    if (item.length < 3 || !price || prot <= 0n || !(hrs >= 1)) return toast("Fill every required field", "err");
    if (await write("createDeal", [item, price, $("#lurl").value.trim(), prot, BigInt(hrs)], 0n, "Offer created")) location.hash = "#/seller/" + S.account;
  };
}

async function pageBecome() {
  const p = await params();
  view(`<h1>Become a <span class="sig">bonded</span> seller</h1>
  <p class="mut">Lock ETH as a bond. If you fail to deliver and lose a dispute, buyers are paid from it.</p>
  <div class="card">
  <div class="row between"><span>STARTER</span><span class="mut">${eth(p.MIN_BOND)}+ ETH · up to ${eth(p.MAX_PROTECT_STARTER)} per deal</span></div>
  <div class="row between"><span>VERIFIED</span><span class="mut">${eth(p.VERIFIED_BOND)}+ ETH · up to ${eth(p.MAX_PROTECT_VERIFIED)}</span></div>
  <div class="row between"><span>PREMIUM</span><span class="mut">${eth(p.PREMIUM_BOND)}+ ETH · up to ${eth(p.MAX_PROTECT_PREMIUM)}</span></div></div>
  <label>Handle (lowercase letters, numbers, _ and .; 3–30)</label><input id="handle" maxlength="30" autocapitalize="none" placeholder="my_shop">
  <label>Bond (ETH)</label><input id="bond" inputmode="decimal" value="${eth(p.MIN_BOND)}">
  <div class="warn-box" style="margin-top:12px">Your handle is a label you choose. BondMark does not prove you own the Instagram account with that name.</div>
  <button class="btn block" style="margin-top:14px" id="reg">Register and lock bond</button>`);
  $("#reg").onclick = async () => {
    const h = $("#handle").value.trim().toLowerCase();
    let v; try { v = parseEther($("#bond").value.trim()); } catch { v = 0n; }
    if (!/^[a-z0-9_.]{3,30}$/.test(h)) return toast("Invalid handle", "err");
    if (v < BigInt(p.MIN_BOND)) return toast("Bond is below the minimum", "err");
    if (await write("registerSeller", [h], v, "Registered")) location.hash = "#/seller/" + h;
  };
}

async function pageMe() {
  if (!S.account) { view(`<h1>Me</h1><div class="card"><p>Connect a wallet to see your deals and balance.</p><button class="btn" id="c3">Connect</button></div>`); $("#c3").onclick = connect; return; }
  skeleton();
  const a = S.account.toLowerCase();
  const [cl, isS, deals] = await Promise.all([read("claimable", [S.account]), read("isSeller", [S.account]), allDeals(100)]);
  const seller = isS ? await read("sellerInfo", [S.account]) : null;
  const mine = deals.filter(d => d.seller.toLowerCase() === a || d.buyer.toLowerCase() === a);
  view(`<h1>Me</h1><div class="mono mut word">${esc(S.account)}</div>
  <div class="card"><div class="row between"><div><div class="mut">Claimable balance</div><b style="font-size:1.5rem">${eth(cl)} ETH</b></div>
  <button class="btn" id="claim" ${BigInt(cl) === 0n ? "disabled" : ""}>Claim</button></div></div>
  ${seller ? sellerCard(seller) : `<a class="btn sec block" href="#/become">Become a seller</a>`}
  <h2>My deals</h2>${mine.length ? mine.map(dealCard).join("") : '<div class="empty">No deals yet.</div>'}
  <p><a href="#/settings">Settings</a></p>`);
  $("#claim").onclick = async () => { if (await write("claim", [], 0n, "Sent to your wallet")) route(); };
}

async function pageHow() {
  view(`<h1>How BondMark works</h1>
  <div class="card"><b>1. Seller posts a bond</b><p class="mut">ETH is locked in the contract. The bond sets how much value one seller can protect.</p></div>
  <div class="card"><b>2. Seller lists a protected deal</b><p class="mut">150% of the protected amount stays locked (120% for proven sellers) until the deal ends.</p></div>
  <div class="card"><b>3. Buyer pays off-chain, then claims</b><p class="mut">Pay by bank transfer, cash app or anything the seller accepts, then paste the payment reference. The seller can accept or reject. If they stay silent for 24 h, the deal binds anyway.</p></div>
  <div class="card"><b>4. Delivery</b><p class="mut">The seller submits delivery proof. The buyer confirms, or after 72 h it completes on its own.</p></div>
  <div class="card"><b>5. Dispute</b><p class="mut">The buyer puts down a small deposit. Both sides add up to 3 pieces of evidence. A designated arbiter then rules: buyer wins (full protected amount), split (half), seller wins, or not enough evidence (one more round, then no payout). If the arbiter stays silent for 7 days anyone can close the dispute with no payout and deposits are returned.</p></div>
  <h2>What it cannot do</h2>
  <div class="warn-box"><ul style="margin:0;padding-left:18px">
  <li>It cannot see your bank. Payments and parcels are judged only from evidence people submit.</li>
  <li>On Base the arbiter is a person or multisig chosen by the contract owner, not an AI. You are trusting that arbiter.</li>
  <li>Handles are not verified accounts.</li>
  <li>When the seller stays silent about a payment, any compensation is capped at 25%, needs reviewed payment proof, and is paid only after a 7-day window in which the seller can challenge.</li>
  <li>Claiming a payment needs a refundable deposit; it is burned (paid to nobody) if the seller rejects the claim.</li>
  <li>Compensation covers the protected amount, not necessarily the full price.</li>
  <li>This is an unaudited prototype. Use Base Sepolia, not real money.</li></ul></div>`);
}

async function pageSettings() {
  view(`<h1>Settings</h1>
  <div class="card"><label>Network</label><select id="netsel"><option value="sepolia" ${S.net === "sepolia" ? "selected" : ""}>Base Sepolia (testnet)</option><option value="mainnet" ${S.net === "mainnet" ? "selected" : ""}>Base mainnet</option></select>
  <label>Contract address</label><input id="caddr" class="mono" value="${esc(S.contract)}" placeholder="0x…">
  <button class="btn block" style="margin-top:10px" id="save">Save</button>
  <p class="mut" style="font-size:.85rem">You can also open this page with <code>?c=0x…&amp;n=sepolia</code>.</p></div>`);
  $("#save").onclick = () => {
    const v = $("#caddr").value.trim();
    if (!validAddr(v)) return toast("Not a valid address", "err");
    store.set("bmb_contract", v); store.set("bmb_net", $("#netsel").value);
    S.contract = v; S.net = $("#netsel").value; S.pc = null; S.params = null;
    paintWallet(); toast("Saved", "good"); location.hash = "#/";
  };
}

async function route() {
  const h = location.hash || "#/";
  paintTabs(h);
  const parts = h.slice(2).split("/");
  try {
    if (parts[0] !== "settings" && parts[0] !== "how" && !validAddr(S.contract)) return pageSettings();
    switch (parts[0]) {
      case "": return await pageHome();
      case "sellers": return await pageSellers();
      case "seller": return await pageSeller(decodeURIComponent(parts[1] || ""));
      case "deal": return await pageDeal(decodeURIComponent(parts[1] || ""));
      case "new": return await pageNew();
      case "become": return await pageBecome();
      case "me": return await pageMe();
      case "how": return await pageHow();
      case "settings": return await pageSettings();
      default: return await pageHome();
    }
  } catch (e) { console.error(e); errBox(e); }
}
window.addEventListener("hashchange", route);
paintWallet();
route();

(async () => {
  try {
    const mod = await import("https://esm.sh/@farcaster/miniapp-sdk@latest");
    const sdk = mod.sdk || mod.default;
    S.mini = sdk;
    const inMini = await sdk.isInMiniApp?.();
    if (inMini) {
      S.provider = await sdk.wallet.getEthereumProvider();
      await sdk.actions.ready();
      if (S.provider) { const accs = await S.provider.request({ method: "eth_accounts" }).catch(() => []); if (accs[0]) { S.account = accs[0]; paintWallet(); route(); } }
    }
  } catch {}
  if (!S.account && store.get("bmb_auto") && window.ethereum) {
    window.ethereum.request({ method: "eth_accounts" }).then(acc => { if (acc && acc[0]) { S.provider = window.ethereum; S.account = acc[0]; paintWallet(); route(); } }).catch(() => {});
  }
})();
</script>
